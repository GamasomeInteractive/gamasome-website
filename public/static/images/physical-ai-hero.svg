<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Humanoid robot using physical AI to perceive and act on an object in the real world">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#e9f0ff"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient>
    <linearGradient id="cone" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#2563eb" stop-opacity="0.28"/><stop offset="1" stop-color="#2563eb" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect width="760" height="300" fill="url(#heroBg)"/>
  <text x="44" y="60" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#2563eb">PHYSICAL AI</text>
  <text x="42" y="100" font-family="sans-serif" font-size="23" font-weight="700" fill="#14213d">Intelligence that senses,</text>
  <text x="42" y="129" font-family="sans-serif" font-size="23" font-weight="700" fill="#14213d">reasons, and acts in the</text>
  <text x="42" y="158" font-family="sans-serif" font-size="23" font-weight="700" fill="#14213d">real world.</text>
  <g font-family="sans-serif" font-size="13" font-weight="600">
    <rect x="42" y="232" width="116" height="34" rx="17" fill="#ffffff" stroke="#c7d2fe"/><text x="100" y="254" text-anchor="middle" fill="#2563eb">1 · Perceive</text>
    <text x="166" y="254" fill="#94a3b8">→</text>
    <rect x="182" y="232" width="112" height="34" rx="17" fill="#ffffff" stroke="#c7d2fe"/><text x="238" y="254" text-anchor="middle" fill="#4f46e5">2 · Reason</text>
    <text x="302" y="254" fill="#94a3b8">→</text>
    <rect x="318" y="232" width="92" height="34" rx="17" fill="#ffffff" stroke="#99f6e4"/><text x="364" y="254" text-anchor="middle" fill="#0d9488">3 · Act</text>
  </g>
  <polygon points="578,118 372,150 372,196 578,150" fill="url(#cone)"/>
  <g><rect x="338" y="150" width="48" height="44" rx="6" fill="#0d9488"/><rect x="338" y="150" width="48" height="13" rx="6" fill="#14b8a6"/><line x1="362" y1="150" x2="362" y2="194" stroke="#0f766e" stroke-width="2"/></g>
  <path d="M560 190 L470 184 L392 176" fill="none" stroke="url(#arm)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="392" cy="176" r="9" fill="#4f46e5"/>
  <rect x="560" y="150" width="96" height="80" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="586" y="168" width="44" height="44" rx="8" fill="#eef2ff"/>
  <rect x="576" y="92" width="64" height="58" rx="14" fill="#2563eb"/>
  <circle cx="596" cy="121" r="8" fill="#ffffff"/><circle cx="596" cy="121" r="3.5" fill="#14213d"/>
  <circle cx="622" cy="121" r="8" fill="#ffffff"/><circle cx="622" cy="121" r="3.5" fill="#14213d"/>
  <line x1="608" y1="92" x2="608" y2="76" stroke="#2563eb" stroke-width="3"/><circle cx="608" cy="72" r="5" fill="#f59e0b"/>
  <circle cx="690" cy="96" r="4" fill="#4f46e5" opacity="0.5"/><circle cx="706" cy="130" r="6" fill="#2563eb" opacity="0.35"/><circle cx="676" cy="150" r="3" fill="#0d9488" opacity="0.5"/>
</svg>
