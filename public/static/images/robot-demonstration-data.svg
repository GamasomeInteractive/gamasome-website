<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a single robot arm tracing a dashed trajectory path from a start point to an end point, with discrete markers along the path representing captured joint state, action, and outcome data at each step">
  <defs>
    <linearGradient id="rdd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07091B"/><stop offset="1" stop-color="#000B71"/>
    </linearGradient>
    <radialGradient id="rdd-glow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#2D9CDB" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#2D9CDB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rdd-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#rdd-bg)"/>
  <rect width="1200" height="630" fill="url(#rdd-glow)"/>
  <rect x="0" y="480" width="1200" height="150" fill="url(#rdd-floor)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="505" x2="1200" y2="505"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="0" y1="585" x2="1200" y2="585"/>
  </g>

  <g fill="#7DD3FC" opacity="0.5">
    <circle cx="120" cy="120" r="2.3"/>
    <circle cx="1080" cy="140" r="2.3"/>
    <circle cx="1000" cy="90" r="2"/>
  </g>

  <!-- start point marker -->
  <g transform="translate(260,420)">
    <circle r="16" fill="none" stroke="#7DD3FC" stroke-width="3"/>
    <circle r="5" fill="#7DD3FC"/>
  </g>

  <!-- dashed trajectory path with discrete markers -->
  <path d="M 260 420 C 360 320, 440 260, 540 230 C 660 190, 760 220, 860 260" fill="none" stroke="#00FCE2" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- discrete data markers along the path: state (square), action (diamond), outcome (circle) -->
  <g transform="translate(340,352)">
    <rect x="-7" y="-7" width="14" height="14" fill="#1C2340" stroke="#2D9CDB" stroke-width="2"/>
  </g>
  <g transform="translate(430,290)">
    <path d="M 0 -9 L 9 0 L 0 9 L -9 0 Z" fill="#1C2340" stroke="#2D9CDB" stroke-width="2"/>
  </g>
  <g transform="translate(520,240)">
    <rect x="-7" y="-7" width="14" height="14" fill="#1C2340" stroke="#2D9CDB" stroke-width="2"/>
  </g>
  <g transform="translate(620,218)">
    <path d="M 0 -9 L 9 0 L 0 9 L -9 0 Z" fill="#1C2340" stroke="#2D9CDB" stroke-width="2"/>
  </g>
  <g transform="translate(720,222)">
    <rect x="-7" y="-7" width="14" height="14" fill="#1C2340" stroke="#2D9CDB" stroke-width="2"/>
  </g>
  <g transform="translate(800,242)">
    <path d="M 0 -9 L 9 0 L 0 9 L -9 0 Z" fill="#1C2340" stroke="#2D9CDB" stroke-width="2"/>
  </g>

  <!-- end point / outcome marker, success check -->
  <g transform="translate(860,260)">
    <circle r="20" fill="#0B0F2A" stroke="#00FCE2" stroke-width="3"/>
    <path d="M -8 0 L -2 7 L 10 -8" stroke="#00FCE2" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- robot arm tracing the path, base anchored lower right -->
  <g transform="translate(900,470)">
    <ellipse cx="0" cy="150" rx="78" ry="14" fill="#000000" opacity="0.25"/>
    <rect x="-40" y="86" width="80" height="60" rx="9" fill="#1C2340" stroke="#2D9CDB" stroke-width="2.2"/>
    <rect x="-16" y="20" width="32" height="70" rx="11" fill="#2D9CDB"/>
    <circle cx="0" cy="14" r="16" fill="#1C2340" stroke="#2D9CDB" stroke-width="2.6"/>
    <path d="M 0 0 C -40 -40, -70 -110, -75 -195" stroke="#2D9CDB" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="-75" cy="-195" r="14" fill="#1C2340" stroke="#00FCE2" stroke-width="2.6"/>
    <path d="M -75 -209 C -60 -215, -48 -208, -40 -208" stroke="#00FCE2" stroke-width="10" stroke-linecap="round" fill="none"/>
    <g transform="translate(-38,-210)">
      <path d="M 0 -10 L 14 -18 M 0 6 L 14 10" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="0" cy="-2" r="6" fill="#0B0F2A" stroke="#00FCE2" stroke-width="2"/>
    </g>
  </g>
</svg>
