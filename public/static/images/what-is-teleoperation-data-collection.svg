<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a human operator wearing a VR headset and holding a small leader control arm, with a dashed signal line arcing across to a larger follower robot arm that mirrors the same motion in real time, representing teleoperation data collection">
  <defs>
    <linearGradient id="tdc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07091B"/><stop offset="1" stop-color="#000B71"/>
    </linearGradient>
    <radialGradient id="tdc-glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2D9CDB" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2D9CDB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tdc-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#tdc-bg)"/>
  <rect width="1200" height="630" fill="url(#tdc-glow)"/>
  <rect x="0" y="470" width="1200" height="160" fill="url(#tdc-floor)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
  </g>

  <g fill="#7DD3FC" opacity="0.5">
    <circle cx="140" cy="100" r="2.3"/>
    <circle cx="200" cy="140" r="2"/>
    <circle cx="1050" cy="90" r="2.3"/>
    <circle cx="1000" cy="150" r="2"/>
  </g>

  <!-- LEFT: human operator, VR headset, seated, holding small leader arm -->
  <g transform="translate(290,340)">
    <ellipse cx="0" cy="180" rx="64" ry="14" fill="#000000" opacity="0.25"/>
    <!-- torso -->
    <path d="M -2 -60 C -32 -54, -44 -24, -40 16 L -34 120 L -12 120 L -16 10 L 0 10 L 8 120 L 30 120 L 24 16 C 42 8, 50 -20, 34 -48 C 22 -66, 8 -66, -2 -60 Z" fill="#E7ECF5"/>
    <!-- head with VR headset -->
    <circle cx="2" cy="-86" r="23" fill="#E7ECF5"/>
    <rect x="-20" y="-98" width="44" height="26" rx="8" fill="#0B0F2A" stroke="#00FCE2" stroke-width="2.5"/>
    <circle cx="-7" cy="-86" r="5" fill="#00FCE2" opacity="0.8"/>
    <circle cx="13" cy="-86" r="5" fill="#00FCE2" opacity="0.8"/>
    <!-- arms reaching forward to small leader arm on a desk -->
    <path d="M 26 -24 C 48 -16, 64 2, 74 24" stroke="#E7ECF5" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M -24 -24 C -44 -14, -58 4, -66 26" stroke="#E7ECF5" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- desk -->
    <rect x="-110" y="54" width="220" height="12" rx="3" fill="#1C2340" stroke="#2D9CDB" stroke-width="1.4"/>
    <!-- small leader arm miniature -->
    <g transform="translate(60,40)">
      <rect x="-8" y="0" width="16" height="14" rx="3" fill="#1C2340" stroke="#2D9CDB" stroke-width="1.6"/>
      <rect x="-4" y="-22" width="8" height="24" rx="4" fill="#2D9CDB"/>
      <circle cx="0" cy="-26" r="6" fill="#1C2340" stroke="#2D9CDB" stroke-width="1.6"/>
      <path d="M 0 -32 C 10 -38, 18 -48, 22 -58" stroke="#2D9CDB" stroke-width="6" stroke-linecap="round" fill="none"/>
      <circle cx="22" cy="-58" r="5" fill="#1C2340" stroke="#00FCE2" stroke-width="1.6"/>
    </g>
  </g>

  <!-- CENTER: dashed pulsing signal line mirroring motion -->
  <g>
    <path d="M 420 300 C 540 260, 660 260, 780 300" stroke="#00FCE2" stroke-width="2.5" stroke-dasharray="3 10" fill="none" opacity="0.85"/>
    <circle cx="600" cy="268" r="5" fill="#00FCE2"/>
    <circle cx="500" cy="282" r="3" fill="#7DD3FC" opacity="0.8"/>
    <circle cx="700" cy="282" r="3" fill="#7DD3FC" opacity="0.8"/>
  </g>

  <!-- RIGHT: larger follower robot arm mirroring the same motion -->
  <g transform="translate(900,330)">
    <ellipse cx="0" cy="190" rx="72" ry="14" fill="#000000" opacity="0.25"/>
    <rect x="-38" y="118" width="76" height="58" rx="9" fill="#1C2340" stroke="#2D9CDB" stroke-width="2.2"/>
    <rect x="-15" y="56" width="30" height="66" rx="11" fill="#2D9CDB"/>
    <circle cx="0" cy="50" r="16" fill="#1C2340" stroke="#2D9CDB" stroke-width="2.6"/>
    <path d="M 0 36 C 36 18, 62 -12, 76 -50" stroke="#2D9CDB" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="76" cy="-50" r="14" fill="#1C2340" stroke="#00FCE2" stroke-width="2.6"/>
    <path d="M 76 -64 C 104 -76, 124 -98, 136 -124" stroke="#00FCE2" stroke-width="13" stroke-linecap="round" fill="none"/>
    <g transform="translate(140,-128)">
      <path d="M -6 -16 L 12 -30 M -6 6 L 12 16" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="-6" cy="-6" r="8" fill="#0B0F2A" stroke="#00FCE2" stroke-width="2.2"/>
    </g>
    <!-- object the follower manipulates -->
    <rect x="96" y="40" width="54" height="36" rx="5" fill="#1C2340" stroke="#00FCE2" stroke-width="1.8"/>
    <rect x="108" y="16" width="30" height="26" rx="4" fill="#00FCE2" opacity="0.85"/>
  </g>
</svg>
