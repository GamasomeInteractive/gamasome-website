<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five-layer stack of embodied AI data sources, from pooled open datasets and internet video at the base through simulation and wearable human capture to real-robot teleoperation at the top, with fidelity to the target embodiment rising and achievable scale falling as you move up the stack">
  <rect x="0" y="0" width="900" height="460" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#14213d">The collection stack</text>

  <!-- axis labels -->
  <text x="840" y="56" font-family="sans-serif" font-size="10" fill="#2563eb" text-anchor="end">HIGH FIDELITY</text>
  <text x="840" y="430" font-family="sans-serif" font-size="10" fill="#d97706" text-anchor="end">HIGH SCALE</text>
  <line x1="818" y1="62" x2="818" y2="404" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 818 62 L 812 72 L 824 72 Z" fill="#2563eb"/>
  <path d="M 818 404 L 812 394 L 824 394 Z" fill="#d97706"/>

  <!-- Layer 5 teleoperation (top) -->
  <rect x="30" y="56" width="760" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="80" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563eb">LAYER 05</text>
  <text x="50" y="102" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Teleoperation on the target robot</text>
  <text x="780" y="92" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="end">highest fidelity</text>

  <!-- Layer 4 wearable -->
  <rect x="30" y="128" width="760" height="64" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <text x="50" y="152" font-family="sans-serif" font-size="10" font-weight="700" fill="#0d9488">LAYER 04</text>
  <text x="50" y="174" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Wearable &amp; handheld human demonstration</text>
  <text x="780" y="164" font-family="sans-serif" font-size="11" fill="#0d9488" text-anchor="end">UMI, JoyEgoCam</text>

  <!-- Layer 3 simulation -->
  <rect x="30" y="200" width="760" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="50" y="224" font-family="sans-serif" font-size="10" font-weight="700" fill="#475569">LAYER 03</text>
  <text x="50" y="246" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Simulation</text>
  <text x="780" y="236" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">contact fidelity gap</text>

  <!-- Layer 2 internet video -->
  <rect x="30" y="272" width="760" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="50" y="296" font-family="sans-serif" font-size="10" font-weight="700" fill="#475569">LAYER 02</text>
  <text x="50" y="318" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Internet &amp; crowdsourced human video</text>
  <text x="780" y="308" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">no action labels</text>

  <!-- Layer 1 pooled datasets (base) -->
  <rect x="30" y="344" width="760" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="50" y="368" font-family="sans-serif" font-size="10" font-weight="700" fill="#d97706">LAYER 01</text>
  <text x="50" y="390" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Pooled open datasets</text>
  <text x="780" y="380" font-family="sans-serif" font-size="11" fill="#d97706" text-anchor="end">Open X-Embodiment</text>

  <line x1="30" y1="424" x2="790" y2="424" stroke="#e2e8f0"/>
  <text x="30" y="446" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Most production programs draw from at least three layers at once, not just the top or bottom.</text>
</svg>
