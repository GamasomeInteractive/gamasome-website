<svg viewBox="0 0 1040 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram showing annotation split into two markets: commodity labeling deflating toward automation at low single-digit dollars per hour, and expert human data rising toward 85 to 200 dollars per hour, roughly a fifty-fold spread">
  <rect x="0" y="0" width="1040" height="320" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="36" font-family="sans-serif" font-size="12" font-weight="700" fill="#14213d">One category name, two markets</text>

  <rect x="30" y="64" width="470" height="204" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54" y="98" font-family="sans-serif" font-size="18" font-weight="700" fill="#14213d">Commodity labeling</text>
  <text x="54" y="124" font-family="sans-serif" font-size="13" fill="#475569">Bounding boxes, tagging, classification</text>
  <text x="54" y="146" font-family="sans-serif" font-size="13" fill="#475569">Judgment not required</text>
  <text x="54" y="192" font-family="sans-serif" font-size="24" font-weight="700" fill="#dc2626">Low single digits / hr</text>
  <path d="M 54 216 L 54 244 M 46 236 L 54 246 L 62 236" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="76" y="242" font-family="sans-serif" font-size="12" fill="#dc2626">Deflating. Roughly halved since 2022.</text>

  <rect x="540" y="64" width="470" height="204" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="564" y="98" font-family="sans-serif" font-size="18" font-weight="700" fill="#14213d">Expert human data</text>
  <text x="564" y="124" font-family="sans-serif" font-size="13" fill="#475569">Reasoning traces, rubrics, RLHF grading</text>
  <text x="564" y="146" font-family="sans-serif" font-size="13" fill="#475569">Credentialed specialists</text>
  <text x="564" y="192" font-family="sans-serif" font-size="24" font-weight="700" fill="#d97706">$85 to $200 / hr</text>
  <path d="M 564 246 L 564 218 M 556 226 L 564 216 L 572 226" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="586" y="242" font-family="sans-serif" font-size="12" fill="#b45309">Rising. Where lab spend migrated.</text>

  <line x1="500" y1="166" x2="540" y2="166" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="30" y1="288" x2="1010" y2="288" stroke="#e2e8f0"/>
  <text x="30" y="308" font-family="sans-serif" font-size="11" fill="#94a3b8">Roughly a fifty-fold spread. Comparing a rate card from one side against the other tells you nothing.</text>
</svg>
