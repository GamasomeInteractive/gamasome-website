<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of irregular, misaligned raw data particles flowing into a filter funnel and emerging as a clean, evenly spaced stream of uniform particles with a validation checkmark, representing improving data quality in AI training">
  <defs>
    <linearGradient id="dqat-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07091B"/><stop offset="1" stop-color="#000B71"/>
    </linearGradient>
    <radialGradient id="dqat-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2D9CDB" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2D9CDB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dqat-funnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C2340"/><stop offset="1" stop-color="#0B0F2A"/>
    </linearGradient>
    <linearGradient id="dqat-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#dqat-bg)"/>
  <rect width="1200" height="630" fill="url(#dqat-glow)"/>
  <rect x="0" y="500" width="1200" height="130" fill="url(#dqat-floor)"/>

  <!-- faint grid floor -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="530" x2="1200" y2="530"/>
    <line x1="0" y1="565" x2="1200" y2="565"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- background specks -->
  <g fill="#7DD3FC" opacity="0.45">
    <circle cx="120" cy="80" r="2"/>
    <circle cx="300" cy="60" r="2.5"/>
    <circle cx="1080" cy="90" r="2.5"/>
    <circle cx="940" cy="60" r="2"/>
    <circle cx="70" cy="470" r="2"/>
    <circle cx="1140" cy="480" r="2"/>
  </g>

  <!-- LEFT: messy raw particles of mixed shape, size, and alignment -->
  <g>
    <!-- faint wavy inbound paths -->
    <path d="M 40 210 C 140 170, 220 260, 330 230 S 420 260, 450 280" stroke="#7DD3FC" stroke-opacity="0.25" stroke-width="1.6" fill="none" stroke-dasharray="3 9"/>
    <path d="M 40 420 C 150 450, 230 360, 330 400 S 420 360, 450 345" stroke="#7DD3FC" stroke-opacity="0.25" stroke-width="1.6" fill="none" stroke-dasharray="3 9"/>

    <!-- jagged shards -->
    <path d="M 90 180 L 112 168 L 120 190 L 104 204 L 86 196 Z" fill="none" stroke="#7DD3FC" stroke-width="2"/>
    <path d="M 210 250 L 236 240 L 230 266 L 248 278 L 218 284 Z" fill="#2D9CDB" opacity="0.55"/>
    <path d="M 150 340 L 170 322 L 186 346 L 160 360 Z" fill="none" stroke="#00FCE2" stroke-width="2" opacity="0.7" transform="rotate(18 168 340)"/>
    <path d="M 300 430 L 326 418 L 334 444 L 312 456 Z" fill="#E7ECF5" opacity="0.35"/>
    <path d="M 340 190 L 358 200 L 350 220 L 334 212 Z" fill="none" stroke="#E7ECF5" stroke-width="2" opacity="0.6"/>

    <!-- off-size circles and squares at odd angles -->
    <circle cx="60" cy="300" r="13" fill="none" stroke="#2D9CDB" stroke-width="2.2"/>
    <circle cx="260" cy="190" r="5" fill="#00FCE2" opacity="0.6"/>
    <circle cx="120" cy="440" r="9" fill="#7DD3FC" opacity="0.45"/>
    <circle cx="380" cy="300" r="15" fill="none" stroke="#7DD3FC" stroke-width="2" stroke-dasharray="4 5"/>
    <circle cx="240" cy="370" r="4" fill="#E7ECF5" opacity="0.7"/>
    <rect x="180" y="150" width="18" height="18" rx="2" fill="none" stroke="#00FCE2" stroke-width="2" opacity="0.6" transform="rotate(27 189 159)"/>
    <rect x="70" y="370" width="26" height="14" rx="3" fill="#2D9CDB" opacity="0.5" transform="rotate(-22 83 377)"/>
    <rect x="360" y="380" width="12" height="22" rx="2" fill="none" stroke="#E7ECF5" stroke-width="2" opacity="0.5" transform="rotate(40 366 391)"/>
    <rect x="290" y="300" width="20" height="20" rx="3" fill="#7DD3FC" opacity="0.3" transform="rotate(12 300 310)"/>

    <!-- broken/noisy fragments -->
    <path d="M 150 240 L 162 228 M 166 244 L 178 232" stroke="#7DD3FC" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 410 230 L 420 248 L 430 228" stroke="#00FCE2" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 200 460 L 214 448 L 226 462 L 240 450" stroke="#E7ECF5" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- CENTER: filter funnel lying on its side -->
  <g>
    <!-- funnel body -->
    <path d="M 460 170 L 660 270 L 660 360 L 460 460 Z" fill="url(#dqat-funnel)" stroke="#2D9CDB" stroke-width="3" stroke-linejoin="round"/>
    <!-- mouth rim -->
    <ellipse cx="460" cy="315" rx="22" ry="145" fill="none" stroke="#7DD3FC" stroke-width="3"/>
    <!-- internal filter mesh -->
    <g stroke="#2D9CDB" stroke-opacity="0.45" stroke-width="1.5">
      <line x1="510" y1="198" x2="510" y2="432"/>
      <line x1="560" y1="222" x2="560" y2="408"/>
      <line x1="610" y1="246" x2="610" y2="384"/>
    </g>
    <g fill="#00FCE2" opacity="0.55">
      <circle cx="510" cy="250" r="2.5"/><circle cx="510" cy="300" r="2.5"/><circle cx="510" cy="350" r="2.5"/><circle cx="510" cy="400" r="2.5"/>
      <circle cx="560" cy="270" r="2.5"/><circle cx="560" cy="315" r="2.5"/><circle cx="560" cy="360" r="2.5"/>
      <circle cx="610" cy="290" r="2.5"/><circle cx="610" cy="340" r="2.5"/>
    </g>
    <!-- spout -->
    <rect x="660" y="285" width="70" height="60" rx="8" fill="#1C2340" stroke="#00FCE2" stroke-width="3"/>
    <rect x="676" y="300" width="38" height="30" rx="5" fill="none" stroke="#00FCE2" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- rejected particles dropping beneath the funnel -->
    <path d="M 540 470 L 556 462 L 560 480 L 546 486 Z" fill="none" stroke="#7DD3FC" stroke-width="1.8" opacity="0.5"/>
    <circle cx="590" cy="500" r="6" fill="none" stroke="#7DD3FC" stroke-width="1.6" opacity="0.4"/>
    <rect x="510" y="505" width="12" height="12" rx="2" fill="#2D9CDB" opacity="0.35" transform="rotate(30 516 511)"/>
    <ellipse cx="560" cy="530" rx="70" ry="8" fill="#000000" opacity="0.25"/>
  </g>

  <!-- RIGHT: clean, evenly spaced output stream -->
  <g>
    <line x1="740" y1="315" x2="1060" y2="315" stroke="#00FCE2" stroke-opacity="0.25" stroke-width="2"/>
    <g fill="#00FCE2">
      <circle cx="765" cy="315" r="9"/>
      <circle cx="810" cy="315" r="9"/>
      <circle cx="855" cy="315" r="9"/>
      <circle cx="900" cy="315" r="9"/>
      <circle cx="945" cy="315" r="9"/>
      <circle cx="990" cy="315" r="9"/>
    </g>
    <g fill="#7DD3FC" opacity="0.55">
      <circle cx="787" cy="285" r="5"/><circle cx="832" cy="285" r="5"/><circle cx="877" cy="285" r="5"/><circle cx="922" cy="285" r="5"/><circle cx="967" cy="285" r="5"/>
      <circle cx="787" cy="345" r="5"/><circle cx="832" cy="345" r="5"/><circle cx="877" cy="345" r="5"/><circle cx="922" cy="345" r="5"/><circle cx="967" cy="345" r="5"/>
    </g>

    <!-- validation badge with checkmark -->
    <g transform="translate(1070,315)">
      <circle cx="0" cy="0" r="58" fill="#00FCE2" opacity="0.08"/>
      <circle cx="0" cy="0" r="44" fill="#0B0F2A" stroke="#00FCE2" stroke-width="3.5"/>
      <path d="M -18 2 L -5 15 L 20 -12" stroke="#00FCE2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- neat stacked blocks below the stream, implying a versioned dataset -->
    <g transform="translate(880,420)">
      <ellipse cx="0" cy="98" rx="80" ry="10" fill="#000000" opacity="0.25"/>
      <rect x="-60" y="60" width="120" height="26" rx="5" fill="#1C2340" stroke="#2D9CDB" stroke-width="2"/>
      <rect x="-60" y="30" width="120" height="26" rx="5" fill="#1C2340" stroke="#7DD3FC" stroke-width="2"/>
      <rect x="-60" y="0" width="120" height="26" rx="5" fill="#1C2340" stroke="#00FCE2" stroke-width="2"/>
      <circle cx="-42" cy="13" r="4" fill="#00FCE2"/>
      <circle cx="-42" cy="43" r="4" fill="#7DD3FC"/>
      <circle cx="-42" cy="73" r="4" fill="#2D9CDB"/>
    </g>
    <path d="M 880 360 L 880 412" stroke="#00FCE2" stroke-width="2" stroke-dasharray="2 8" opacity="0.7"/>
  </g>
</svg>
