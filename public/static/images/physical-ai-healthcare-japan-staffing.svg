<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart showing that Japanese nursing homes adopting care robots saw a 28 percent increase in care worker employment and a 39 percent increase in nurses, alongside reduced staff retention difficulty">
  <rect x="0" y="0" width="760" height="300" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="32" y="40" font-family="sans-serif" font-size="13" font-weight="700" fill="#14213d">Care robot adoption — Japanese nursing homes</text>
  <text x="32" y="60" font-family="sans-serif" font-size="12" fill="#475569">Associated change in staffing after adoption</text>

  <line x1="240" y1="84" x2="240" y2="228" stroke="#64748b" stroke-width="2"/>

  <rect x="240" y="98" width="300" height="42" rx="5" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
  <text x="40" y="124" font-family="sans-serif" font-size="12" font-weight="700" fill="#14213d">Care workers</text>
  <text x="552" y="126" font-family="sans-serif" font-size="20" font-weight="700" fill="#0d9488">+28%</text>

  <rect x="240" y="158" width="418" height="42" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="40" y="184" font-family="sans-serif" font-size="12" font-weight="700" fill="#14213d">Nurses</text>
  <text x="670" y="186" font-family="sans-serif" font-size="20" font-weight="700" fill="#2563eb">+39%</text>

  <text x="40" y="262" font-family="sans-serif" font-size="11" fill="#94a3b8">Retention difficulty fell. Care quality did not decline. Robots behaved as complements, not substitutes.</text>
</svg>
