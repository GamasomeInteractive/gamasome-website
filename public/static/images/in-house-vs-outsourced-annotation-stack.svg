<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stacked diagram of five annotation layers showing guideline authorship, edge case adjudication, quality measurement and data custody as typically internal, with production labeling as the layer most commonly outsourced">
  <rect x="0" y="0" width="760" height="380" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="28" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#14213d">The annotation stack</text>
  <circle cx="560" cy="29" r="5" fill="#0d9488"/><text x="574" y="33" font-family="sans-serif" font-size="11" fill="#475569">Keep internal</text>
  <circle cx="660" cy="29" r="5" fill="#2563eb"/><text x="674" y="33" font-family="sans-serif" font-size="11" fill="#475569">Usually buy</text>

  <!-- L1 -->
  <rect x="28" y="52" width="704" height="56" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="46" y="76" font-family="sans-serif" font-size="10" font-weight="700" fill="#0d9488">LAYER 01</text>
  <text x="140" y="78" font-family="sans-serif" font-size="15" font-weight="700" fill="#14213d">Guideline authorship</text>
  <text x="140" y="96" font-family="sans-serif" font-size="12" fill="#475569">what a label means · taxonomy · definitions of done</text>

  <!-- L2 -->
  <rect x="28" y="118" width="704" height="56" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="46" y="142" font-family="sans-serif" font-size="10" font-weight="700" fill="#0d9488">LAYER 02</text>
  <text x="140" y="144" font-family="sans-serif" font-size="15" font-weight="700" fill="#14213d">Edge-case adjudication</text>
  <text x="140" y="162" font-family="sans-serif" font-size="12" fill="#475569">who settles a disagreement, and how the ruling gets written back</text>

  <!-- L3 -->
  <rect x="28" y="184" width="704" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="46" y="210" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563eb">LAYER 03</text>
  <text x="140" y="212" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Production labeling</text>
  <text x="140" y="231" font-family="sans-serif" font-size="12" fill="#475569">throughput · staffing · ramp · turnover · surge capacity</text>

  <!-- L4 -->
  <rect x="28" y="258" width="704" height="56" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="46" y="282" font-family="sans-serif" font-size="10" font-weight="700" fill="#0d9488">LAYER 04</text>
  <text x="140" y="284" font-family="sans-serif" font-size="15" font-weight="700" fill="#14213d">Quality measurement</text>
  <text x="140" y="302" font-family="sans-serif" font-size="12" fill="#475569">gold sets · inter-annotator agreement · acceptance criteria</text>

  <!-- L5 -->
  <rect x="28" y="324" width="704" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="46" y="349" font-family="sans-serif" font-size="10" font-weight="700" fill="#d97706">LAYER 05</text>
  <text x="140" y="350" font-family="sans-serif" font-size="14" font-weight="700" fill="#14213d">Tooling &amp; data custody</text>
  <text x="360" y="350" font-family="sans-serif" font-size="12" fill="#475569">negotiable, but ownership and export format are not</text>
</svg>
