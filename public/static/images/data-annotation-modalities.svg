<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The five data modalities annotation covers: image, video, text, audio, and sensor or 3D data">
  <defs>
    <linearGradient id="modBg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient>
  </defs>
  <rect width="760" height="260" fill="url(#modBg)"/>
  <text x="380" y="46" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#2563eb">FIVE MODALITIES</text>

  <!-- Image -->
  <rect x="36" y="72" width="128" height="130" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1.5"/>
  <g transform="translate(100,116)">
    <rect x="-26" y="-19" width="52" height="38" rx="4" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="-13" y="-7" width="17" height="16" rx="2" fill="none" stroke="#4f46e5" stroke-width="2"/>
  </g>
  <text x="100" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#14213d">Image</text>
  <text x="100" y="184" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">Boxes · polygons</text>

  <!-- Video -->
  <rect x="180" y="72" width="128" height="130" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1.5"/>
  <g transform="translate(244,116)">
    <rect x="-26" y="-19" width="52" height="38" rx="4" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M-6 -10 L12 0 L-6 10 Z" fill="#4f46e5"/>
  </g>
  <text x="244" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#14213d">Video</text>
  <text x="244" y="184" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">Tracking · actions</text>

  <!-- Text -->
  <rect x="324" y="72" width="128" height="130" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1.5"/>
  <g transform="translate(388,116)" stroke-width="2.5" stroke-linecap="round">
    <line x1="-26" y1="-12" x2="26" y2="-12" stroke="#2563eb"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#4f46e5"/>
    <line x1="-26" y1="12" x2="8" y2="12" stroke="#2563eb"/>
  </g>
  <text x="388" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#14213d">Text</text>
  <text x="388" y="184" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">Entities · intent</text>

  <!-- Audio -->
  <rect x="468" y="72" width="128" height="130" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1.5"/>
  <g transform="translate(532,116)">
    <polyline points="-26,0 -16,0 -10,-18 -2,18 6,-10 12,0 26,0" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <text x="532" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#14213d">Audio</text>
  <text x="532" y="184" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">Speech · events</text>

  <!-- Sensor / 3D -->
  <rect x="612" y="72" width="128" height="130" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1.5"/>
  <g transform="translate(676,116)">
    <circle cx="-18" cy="-10" r="3.2" fill="#2563eb"/>
    <circle cx="0" cy="-16" r="3.2" fill="#2563eb"/>
    <circle cx="17" cy="-4" r="3.2" fill="#0d9488"/>
    <circle cx="-10" cy="6" r="3.2" fill="#2563eb"/>
    <circle cx="9" cy="12" r="3.2" fill="#2563eb"/>
    <circle cx="-21" cy="15" r="3.2" fill="#4f46e5"/>
  </g>
  <text x="676" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#14213d">Sensor / 3D</text>
  <text x="676" y="184" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">Point clouds · sync</text>

  <text x="380" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Each modality needs a different labeling technique — and a different definition of "correct."</text>
</svg>
