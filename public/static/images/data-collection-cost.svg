<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart comparing the cost per hour of simple robot data collection at 15 to 30 dollars against complex multi-sensor humanoid collection at 80 to 150 dollars">
  <text x="60" y="40" font-family="sans-serif" font-size="13" font-weight="700" fill="#14213d">Cost per hour of usable data</text>

  <!-- Gridlines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="60" y1="80" x2="720" y2="80"/>
    <line x1="60" y1="140" x2="720" y2="140"/>
    <line x1="60" y1="200" x2="720" y2="200"/>
  </g>
  <line x1="60" y1="260" x2="720" y2="260" stroke="#64748b" stroke-width="2"/>

  <!-- Simple bar -->
  <rect x="180" y="200" width="120" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="240" y="186" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#2563eb">$15–$30</text>
  <text x="240" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#14213d">Simple task</text>
  <text x="240" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Constrained 2D · single arm</text>

  <!-- Complex bar -->
  <rect x="480" y="80" width="120" height="180" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="540" y="66" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#d97706">$80–$150</text>
  <text x="540" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#14213d">Complex / humanoid</text>
  <text x="540" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">RGB · LiDAR · IMU · depth</text>

  <text x="660" y="330" text-anchor="end" font-family="sans-serif" font-size="10" fill="#94a3b8">Annotation priced separately</text>
</svg>
