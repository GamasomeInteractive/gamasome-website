<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart comparing humanoid robot tote throughput on a trade show floor at 66 totes per hour against estimated field output of 13 to 20 totes per hour in live warehouse operation">
  <rect x="0" y="0" width="760" height="320" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="32" y="40" font-family="sans-serif" font-size="13" font-weight="700" fill="#14213d">The demo-to-field gap</text>
  <text x="32" y="60" font-family="sans-serif" font-size="12" fill="#475569">Humanoid tote handling — totes per hour</text>

  <line x1="180" y1="90" x2="180" y2="250" stroke="#64748b" stroke-width="2"/>
  <line x1="180" y1="250" x2="720" y2="250" stroke="#64748b" stroke-width="2"/>

  <!-- Trade show bar -->
  <rect x="180" y="104" width="480" height="44" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="40" y="131" font-family="sans-serif" font-size="12" font-weight="700" fill="#14213d">Trade show</text>
  <text x="672" y="132" font-family="sans-serif" font-size="20" font-weight="700" fill="#d97706">66</text>

  <!-- Live site bar -->
  <rect x="180" y="176" width="146" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="40" y="203" font-family="sans-serif" font-size="12" font-weight="700" fill="#14213d">Live site</text>
  <text x="338" y="204" font-family="sans-serif" font-size="20" font-weight="700" fill="#2563eb">13–20</text>

  <text x="180" y="284" font-family="sans-serif" font-size="11" fill="#94a3b8">The gap is not a vendor failure. It is what shared floors, safety stops, charging, and exception handling cost.</text>
</svg>
