<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline turning video and motion data into robot training data, from ingest and sync to retargeting">
  <rect x="0" y="0" width="760" height="250" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="38" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#d97706">FROM FOOTAGE TO POLICY</text>

  <g font-family="sans-serif" font-size="12.5" text-anchor="middle">
    <rect fill="#f8fafc" stroke="#cbd5e1" height="64" rx="8" width="92" x="20" y="90"/>
    <text x="66" y="118" fill="#14213d" font-weight="600">Ingest</text><text x="66" y="136" fill="#64748b" font-size="11">raw streams</text>

    <rect fill="#f8fafc" stroke="#cbd5e1" height="64" rx="8" width="92" x="125" y="90"/>
    <text x="171" y="118" fill="#14213d" font-weight="600">Sync</text><text x="171" y="136" fill="#64748b" font-size="11">one clock</text>

    <rect fill="#f8fafc" stroke="#cbd5e1" height="64" rx="8" width="92" x="230" y="90"/>
    <text x="276" y="118" fill="#14213d" font-weight="600">Segment</text><text x="276" y="136" fill="#64748b" font-size="11">subtasks</text>

    <rect fill="#f8fafc" stroke="#cbd5e1" height="64" rx="8" width="92" x="335" y="90"/>
    <text x="381" y="118" fill="#14213d" font-weight="600">Annotate</text><text x="381" y="136" fill="#64748b" font-size="11">hands, objects</text>

    <rect fill="#f8fafc" stroke="#cbd5e1" height="64" rx="8" width="92" x="440" y="90"/>
    <text x="486" y="118" fill="#14213d" font-weight="600">Lift to 3D</text><text x="486" y="136" fill="#64748b" font-size="11">poses, paths</text>

    <rect fill="#eff6ff" stroke="#2563eb" height="64" rx="8" width="92" x="545" y="90"/>
    <text x="591" y="118" fill="#14213d" font-weight="600">Retarget</text><text x="591" y="136" fill="#2563eb" font-size="11">robot body</text>

    <rect fill="#fffbeb" stroke="#d97706" height="64" rx="8" width="92" x="650" y="90"/>
    <text x="696" y="118" fill="#14213d" font-weight="600">Train</text><text x="696" y="136" fill="#d97706" font-size="11">with robot data</text>
  </g>

  <path d="M112 122 H125 M217 122 H230 M322 122 H335 M427 122 H440 M532 122 H545 M637 122 H650" stroke="#d97706" stroke-width="2" fill="none"/>

  <text fill="#475569" font-family="sans-serif" font-size="12.5" x="30" y="200">Capturing motion data at recording time (trackers, gripper sensors, robot state) lets you skip most of the</text>
  <text fill="#475569" font-family="sans-serif" font-size="12.5" x="30" y="220">error-prone estimation in the middle steps.</text>
</svg>
