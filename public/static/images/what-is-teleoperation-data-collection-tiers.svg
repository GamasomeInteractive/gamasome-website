<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparison of four teleoperation interface tiers, 3D mouse, VR controllers, leader-follower arms, and haptic exoskeleton rigs, showing hardware cost rising and operator throughput falling as fidelity increases from tier one to tier four">
  <rect x="0" y="0" width="900" height="460" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#14213d">Teleoperation rig tiers: cost and fidelity trade-off</text>

  <text x="840" y="56" font-family="sans-serif" font-size="10" fill="#2563eb" text-anchor="end">HIGHER FIDELITY, HIGHER COST</text>
  <line x1="818" y1="62" x2="818" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 818 62 L 812 72 L 824 72 Z" fill="#2563eb"/>
  <text x="840" y="378" font-family="sans-serif" font-size="10" fill="#d97706" text-anchor="end">HIGHER THROUGHPUT, LOWER COST</text>
  <path d="M 818 360 L 812 350 L 824 350 Z" fill="#d97706"/>

  <!-- Tier 4 top: haptic / exoskeleton -->
  <rect x="30" y="62" width="770" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="50" y="86" font-family="sans-serif" font-size="10" font-weight="700" fill="#dc2626">TIER 04</text>
  <text x="50" y="108" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Haptic &amp; exoskeleton rigs</text>
  <text x="780" y="90" font-family="sans-serif" font-size="11" fill="#dc2626" text-anchor="end">highest cost</text>
  <text x="780" y="108" font-family="sans-serif" font-size="11" fill="#dc2626" text-anchor="end">lowest throughput</text>

  <!-- Tier 3: leader-follower -->
  <rect x="30" y="134" width="770" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="158" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563eb">TIER 03</text>
  <text x="50" y="180" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Leader-follower kinematic twins</text>
  <text x="780" y="162" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="end">ALOHA, GELLO</text>
  <text x="780" y="180" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="end">joint-space match</text>

  <!-- Tier 2: VR -->
  <rect x="30" y="206" width="770" height="64" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <text x="50" y="230" font-family="sans-serif" font-size="10" font-weight="700" fill="#0d9488">TIER 02</text>
  <text x="50" y="252" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">VR headset &amp; controllers</text>
  <text x="780" y="234" font-family="sans-serif" font-size="11" fill="#0d9488" text-anchor="end">used by DROID</text>
  <text x="780" y="252" font-family="sans-serif" font-size="11" fill="#0d9488" text-anchor="end">latency-sensitive</text>

  <!-- Tier 1: 3D mouse -->
  <rect x="30" y="278" width="770" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="50" y="302" font-family="sans-serif" font-size="10" font-weight="700" fill="#d97706">TIER 01</text>
  <text x="50" y="324" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">3D mouse &amp; joystick</text>
  <text x="780" y="306" font-family="sans-serif" font-size="11" fill="#d97706" text-anchor="end">lowest cost</text>
  <text x="780" y="324" font-family="sans-serif" font-size="11" fill="#d97706" text-anchor="end">precise, slow motion only</text>

  <line x1="30" y1="362" x2="790" y2="362" stroke="#e2e8f0"/>
  <text x="30" y="386" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Pick the cheapest tier that provides the fidelity your task actually needs, not the one already on hand.</text>
  <text x="30" y="406" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Reset time between episodes affects throughput at every tier more than the interface itself.</text>
</svg>
