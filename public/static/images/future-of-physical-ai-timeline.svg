<g fill="#d97706"><circle cx="70" cy="160" r="6"/><circle cx="170" cy="160" r="6"/><circle cx="290" cy="160" r="6"/><circle cx="410" cy="160" r="6"/><circle cx="520" cy="160" r="6"/><circle cx="620" cy="160" r="6"/><circle cx="700" cy="160" r="6"/></g>
<g fill="#2563eb" font-family="sans-serif" font-size="11" text-anchor="middle">
