<rect fill="#eff6ff" height="56" rx="8" stroke="#2563eb" width="640" x="60" y="210"/><text x="80" y="236">Digital AI foundation: vision-language model trained on web data</text><text fill="#64748b" font-size="12" x="80" y="255">gives semantics, object names, common sense</text>
<rect fill="#f8fafc" height="56" rx="8" stroke="#cbd5e1" width="540" x="110" y="140"/><text x="130" y="166">Cross-robot and synthetic action data</text><text fill="#64748b" font-size="12" x="130" y="185">gives general motor skills</text>
