<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of scattered, inconsistent data streams on the left narrowing through a funnel-shaped filter in the center, emerging as a single clean stream that flows into a confident robot arm making a precise grasp on the right, representing quality filtering of robot training data">
  <defs>
    <linearGradient id="rtdc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07091B"/><stop offset="1" stop-color="#000B71"/>
    </linearGradient>
    <radialGradient id="rtdc-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2D9CDB" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#2D9CDB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rtdc-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#rtdc-bg)"/>
  <rect width="1200" height="630" fill="url(#rtdc-glow)"/>
  <rect x="0" y="470" width="1200" height="160" fill="url(#rtdc-floor)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
  </g>

  <!-- scattered background data points -->
  <g fill="#7DD3FC" opacity="0.45">
    <circle cx="90" cy="110" r="2.3"/>
    <circle cx="160" cy="80" r="2"/>
    <circle cx="60" cy="200" r="2"/>
    <circle cx="1130" cy="120" r="2.3"/>
    <circle cx="1080" cy="80" r="2"/>
    <circle cx="1150" cy="300" r="2"/>
  </g>

  <!-- LEFT: scattered, inconsistent raw streams, jagged and uneven -->
  <g transform="translate(150,250)">
    <path d="M -40 -60 L 20 -40 L -10 -10 L 40 10 L 0 30 L 50 55" fill="none" stroke="#E7ECF5" stroke-width="3" stroke-opacity="0.55" stroke-linecap="round"/>
    <path d="M -60 20 L -10 40 L -30 70 L 20 90 L -10 115" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-opacity="0.55" stroke-linecap="round"/>
    <path d="M -50 -110 L 0 -95 L -20 -70 L 30 -55" fill="none" stroke="#2D9CDB" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>
    <circle cx="-40" cy="-60" r="4" fill="#E7ECF5"/>
    <circle cx="20" cy="-40" r="4" fill="#E7ECF5"/>
    <circle cx="-10" cy="-10" r="4" fill="#E7ECF5"/>
    <circle cx="40" cy="10" r="4" fill="#E7ECF5"/>
    <circle cx="0" cy="30" r="4" fill="#E7ECF5"/>
    <circle cx="50" cy="55" r="4" fill="#E7ECF5"/>
    <circle cx="-60" cy="20" r="4" fill="#7DD3FC"/>
    <circle cx="-10" cy="40" r="4" fill="#7DD3FC"/>
    <circle cx="-30" cy="70" r="4" fill="#7DD3FC"/>
    <circle cx="20" cy="90" r="4" fill="#7DD3FC"/>
    <circle cx="-10" cy="115" r="4" fill="#7DD3FC"/>
    <circle cx="-50" cy="-110" r="4" fill="#2D9CDB"/>
    <circle cx="0" cy="-95" r="4" fill="#2D9CDB"/>
    <circle cx="-20" cy="-70" r="4" fill="#2D9CDB"/>
    <circle cx="30" cy="-55" r="4" fill="#2D9CDB"/>
  </g>

  <!-- CENTER: funnel filter shape -->
  <g transform="translate(600,255)">
    <path d="M -170 -140 L 170 -140 L 60 60 L 60 150 L -60 150 L -60 60 Z" fill="none" stroke="#00FCE2" stroke-width="3"/>
    <line x1="-120" y1="-100" x2="120" y2="-100" stroke="#00FCE2" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="-80" y1="-40" x2="80" y2="-40" stroke="#00FCE2" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="-20" y1="20" x2="20" y2="20" stroke="#00FCE2" stroke-width="2" stroke-opacity="0.5"/>
  </g>

  <!-- clean single stream exiting the funnel toward the robot -->
  <path d="M 660 465 C 720 465, 760 460, 820 440" stroke="#00FCE2" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="820" cy="440" r="5" fill="#00FCE2"/>

  <!-- RIGHT: robot arm making a precise grasp -->
  <g transform="translate(940,330)">
    <ellipse cx="0" cy="190" rx="70" ry="14" fill="#000000" opacity="0.25"/>
    <rect x="-36" y="120" width="72" height="56" rx="8" fill="#1C2340" stroke="#2D9CDB" stroke-width="2"/>
    <rect x="-14" y="60" width="28" height="64" rx="10" fill="#2D9CDB"/>
    <circle cx="0" cy="54" r="15" fill="#1C2340" stroke="#2D9CDB" stroke-width="2.5"/>
    <path d="M 0 40 C -30 20, -54 -10, -66 -46" stroke="#2D9CDB" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="-66" cy="-46" r="13" fill="#1C2340" stroke="#00FCE2" stroke-width="2.5"/>
    <path d="M -66 -59 C -92 -70, -112 -92, -122 -118" stroke="#00FCE2" stroke-width="12" stroke-linecap="round" fill="none"/>
    <g transform="translate(-126,-122)">
      <path d="M 6 -14 L -10 -26 M 6 6 L -10 16" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="6" cy="-4" r="7" fill="#0B0F2A" stroke="#00FCE2" stroke-width="2"/>
    </g>
    <!-- object being grasped precisely -->
    <rect x="-150" y="-152" width="40" height="40" rx="5" fill="#1C2340" stroke="#00FCE2" stroke-width="2"/>
    <circle cx="-130" cy="-132" r="5" fill="#00FCE2"/>
  </g>
</svg>
