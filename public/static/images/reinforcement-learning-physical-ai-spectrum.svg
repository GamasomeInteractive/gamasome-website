<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spectrum showing where reinforcement learning is used, from simulation-only locomotion to real-world fine-tuning of manipulation policies">
  <rect x="0" y="0" width="760" height="270" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="34" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#d97706">WHERE RL SITS TODAY</text>

  <defs>
    <linearGradient id="rlg" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect x="40" y="108" width="680" height="14" rx="7" fill="url(#rlg)"/>

  <text x="40" y="90" font-family="sans-serif" font-size="11" font-weight="700" fill="#2563eb">MOSTLY SIMULATION</text>
  <text x="720" y="90" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="700" fill="#d97706">MOSTLY REAL WORLD</text>

  <circle cx="110" cy="115" r="9" fill="#ffffff" stroke="#14213d" stroke-width="2"/>
  <text x="60" y="158" font-family="sans-serif" font-size="13" font-weight="700" fill="#14213d">Legged locomotion</text>
  <text x="60" y="176" font-family="sans-serif" font-size="11.5" fill="#94a3b8">RL from scratch in sim</text>

  <circle cx="330" cy="115" r="9" fill="#ffffff" stroke="#14213d" stroke-width="2"/>
  <text x="270" y="158" font-family="sans-serif" font-size="13" font-weight="700" fill="#14213d">Dexterous in-hand</text>
  <text x="270" y="176" font-family="sans-serif" font-size="11.5" fill="#94a3b8">sim + heavy randomization</text>

  <circle cx="490" cy="115" r="9" fill="#ffffff" stroke="#14213d" stroke-width="2"/>
  <text x="430" y="158" font-family="sans-serif" font-size="13" font-weight="700" fill="#14213d">Contact skills</text>
  <text x="430" y="176" font-family="sans-serif" font-size="11.5" fill="#94a3b8">demos + sim RL</text>

  <circle cx="680" cy="115" r="9" fill="#ffffff" stroke="#14213d" stroke-width="2"/>
  <text x="720" y="158" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="700" fill="#14213d">Long-horizon tasks</text>
  <text x="720" y="176" text-anchor="end" font-family="sans-serif" font-size="11.5" fill="#94a3b8">demos + on-robot RL</text>

  <text x="40" y="230" font-family="sans-serif" font-size="13" fill="#475569">The further right a task sits, the more RL depends on real-world data, corrections, and logged outcomes.</text>
</svg>
