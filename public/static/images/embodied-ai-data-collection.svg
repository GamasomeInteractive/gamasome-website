<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a person wearing a handheld sensor rig demonstrating a task beside a robot arm mirroring the same motion, with data streams flowing from both into a stacked database, representing embodied AI data collection">
  <defs>
    <linearGradient id="eadc2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07091B"/><stop offset="1" stop-color="#000B71"/>
    </linearGradient>
    <radialGradient id="eadc2-glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2D9CDB" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2D9CDB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eadc2-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#eadc2-bg)"/>
  <rect width="1200" height="630" fill="url(#eadc2-glow)"/>
  <rect x="0" y="470" width="1200" height="160" fill="url(#eadc2-floor)"/>

  <!-- faint grid floor -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
  </g>

  <!-- scattered data points background -->
  <g fill="#7DD3FC" opacity="0.5">
    <circle cx="150" cy="120" r="2.5"/>
    <circle cx="220" cy="90" r="2"/>
    <circle cx="1040" cy="110" r="2.5"/>
    <circle cx="980" cy="70" r="2"/>
    <circle cx="100" cy="300" r="2"/>
    <circle cx="1120" cy="260" r="2"/>
    <circle cx="60" cy="420" r="2"/>
    <circle cx="1150" cy="440" r="2"/>
  </g>

  <!-- LEFT: human figure with handheld capture rig -->
  <g transform="translate(300,330)">
    <!-- body -->
    <ellipse cx="0" cy="190" rx="62" ry="14" fill="#000000" opacity="0.25"/>
    <path d="M -4 -70 C -34 -64, -46 -34, -42 10 L -36 130 L -14 130 L -18 20 L 2 20 L 10 130 L 32 130 L 26 10 C 44 2, 52 -28, 36 -58 C 24 -78, 8 -78, -4 -70 Z" fill="#E7ECF5"/>
    <circle cx="4" cy="-96" r="24" fill="#E7ECF5"/>
    <!-- raised arm holding capture device -->
    <path d="M 20 -40 C 56 -48, 86 -70, 108 -96" stroke="#E7ECF5" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- other arm reaching to object -->
    <path d="M -30 -30 C -58 -14, -78 14, -92 44" stroke="#E7ECF5" stroke-width="15" stroke-linecap="round" fill="none"/>
    <!-- handheld capture gripper (UMI-style) at raised hand -->
    <g transform="translate(112,-100)">
      <rect x="-10" y="-8" width="34" height="18" rx="6" fill="#0B0F2A" stroke="#00FCE2" stroke-width="2"/>
      <circle cx="30" cy="1" r="9" fill="#0B0F2A" stroke="#00FCE2" stroke-width="2"/>
      <circle cx="30" cy="1" r="3.4" fill="#00FCE2"/>
      <path d="M -10 2 L -28 -14 M -10 10 L -26 24" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- object on a small table the hand reaches for -->
    <rect x="-118" y="40" width="50" height="34" rx="4" fill="#1C2340" stroke="#2D9CDB" stroke-width="1.6"/>
    <rect x="-108" y="18" width="30" height="24" rx="4" fill="#2D9CDB" opacity="0.85"/>
  </g>

  <!-- CENTER: data stream rising to stacked database -->
  <g>
    <path d="M 420 250 C 500 150, 560 90, 600 60" stroke="#00FCE2" stroke-width="2" stroke-dasharray="2 10" fill="none" opacity="0.8"/>
    <path d="M 780 250 C 700 150, 650 90, 600 60" stroke="#7DD3FC" stroke-width="2" stroke-dasharray="2 10" fill="none" opacity="0.8"/>
    <g transform="translate(600,40)">
      <ellipse cx="0" cy="0" rx="46" ry="14" fill="none" stroke="#00FCE2" stroke-width="2.5"/>
      <path d="M -46 0 L -46 26 A46 14 0 0 0 46 26 L 46 0" fill="none" stroke="#00FCE2" stroke-width="2.5"/>
      <path d="M -46 18 L -46 44 A46 14 0 0 0 46 44 L 46 18" fill="none" stroke="#2D9CDB" stroke-width="2.5"/>
      <path d="M -46 36 L -46 62 A46 14 0 0 0 46 62 L 46 36" fill="none" stroke="#7DD3FC" stroke-width="2.5"/>
    </g>
  </g>

  <!-- RIGHT: robot arm mirroring the same reach -->
  <g transform="translate(900,330)">
    <ellipse cx="0" cy="190" rx="70" ry="14" fill="#000000" opacity="0.25"/>
    <rect x="-36" y="120" width="72" height="56" rx="8" fill="#1C2340" stroke="#2D9CDB" stroke-width="2"/>
    <rect x="-14" y="60" width="28" height="64" rx="10" fill="#2D9CDB"/>
    <circle cx="0" cy="54" r="15" fill="#1C2340" stroke="#2D9CDB" stroke-width="2.5"/>
    <path d="M 0 40 C 30 24, 54 -4, 66 -40" stroke="#2D9CDB" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="66" cy="-40" r="13" fill="#1C2340" stroke="#00FCE2" stroke-width="2.5"/>
    <path d="M 66 -53 C 92 -62, 110 -82, 122 -104" stroke="#00FCE2" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- gripper -->
    <g transform="translate(126,-108)">
      <path d="M -6 -16 L 10 -28 M -6 4 L 10 14" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="-6" cy="-6" r="7" fill="#0B0F2A" stroke="#00FCE2" stroke-width="2"/>
    </g>
    <!-- matching object -->
    <rect x="86" y="40" width="50" height="34" rx="4" fill="#1C2340" stroke="#00FCE2" stroke-width="1.6"/>
    <rect x="96" y="18" width="30" height="24" rx="4" fill="#00FCE2" opacity="0.85"/>
  </g>
</svg>
