<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a small autonomous robot following a path dotted with plain common scenario markers, encountering one highlighted rare scenario, a person stepping out beside a sudden burst of glare, which a sensor beam from the robot targets with a reticle and routes into a capture bin, representing edge case data collection">
  <defs>
    <linearGradient id="ecdc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07091B"/><stop offset="1" stop-color="#000B71"/>
    </linearGradient>
    <radialGradient id="ecdc-glow" cx="48%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2D9CDB" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#2D9CDB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ecdc-warnglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ecdc-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ecdc-bg)"/>
  <rect width="1200" height="630" fill="url(#ecdc-glow)"/>
  <rect x="0" y="470" width="1200" height="160" fill="url(#ecdc-floor)"/>

  <!-- faint grid floor -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
  </g>

  <!-- scattered faint data points background -->
  <g fill="#7DD3FC" opacity="0.4">
    <circle cx="140" cy="110" r="2.5"/>
    <circle cx="210" cy="80" r="2"/>
    <circle cx="1050" cy="120" r="2.5"/>
    <circle cx="990" cy="80" r="2"/>
    <circle cx="90" cy="300" r="2"/>
    <circle cx="1130" cy="270" r="2"/>
  </g>

  <!-- the path the robot travels, left to right -->
  <path d="M 90 470 C 300 430, 420 410, 600 420 C 800 430, 950 460, 1110 480" fill="none" stroke="#2D9CDB" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="3 10"/>

  <!-- plain common-scenario markers along the path (small, uniform, unremarkable) -->
  <g fill="#7DD3FC" opacity="0.85">
    <circle cx="220" cy="427" r="7"/>
    <circle cx="340" cy="415" r="7"/>
    <circle cx="460" cy="417" r="7"/>
    <circle cx="820" cy="442" r="7"/>
    <circle cx="940" cy="458" r="7"/>
    <circle cx="1040" cy="470" r="7"/>
  </g>

  <!-- the rare scenario: a person figure stepping out beside a burst of glare -->
  <g transform="translate(660,400)">
    <circle cx="0" cy="0" r="70" fill="url(#ecdc-warnglow)"/>
    <!-- glare burst -->
    <g stroke="#FFB020" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-46" x2="0" y2="-66"/>
      <line x1="32" y1="-32" x2="46" y2="-46"/>
      <line x1="-32" y1="-32" x2="-46" y2="-46"/>
      <line x1="44" y1="2" x2="64" y2="2"/>
      <line x1="-44" y1="2" x2="-64" y2="2"/>
    </g>
    <!-- small human figure stepping into frame -->
    <g transform="translate(6,6)">
      <circle cx="0" cy="-26" r="8" fill="#E7ECF5"/>
      <path d="M -10 -14 C -14 2, -12 18, -8 34 L -2 34 L -3 6 L 3 6 L 4 34 L 10 34 C 14 18, 14 0, 8 -14 C 2 -18, -4 -18, -10 -14 Z" fill="#E7ECF5"/>
      <path d="M -10 -10 C -20 -4, -26 6, -28 16" stroke="#E7ECF5" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
    <!-- amber target reticle flagging it as rare/captured -->
    <circle cx="6" cy="0" r="46" fill="none" stroke="#FFB020" stroke-width="2.5" stroke-dasharray="6 6"/>
    <g stroke="#FFB020" stroke-width="2.5">
      <line x1="6" y1="-56" x2="6" y2="-46"/>
      <line x1="6" y1="46" x2="6" y2="56"/>
      <line x1="-44" y1="0" x2="-54" y2="0"/>
      <line x1="56" y1="0" x2="66" y2="0"/>
    </g>
  </g>

  <!-- the robot, trailing behind on the path, sensor beam reaching toward the rare scenario -->
  <g transform="translate(430,445)">
    <ellipse cx="0" cy="54" rx="58" ry="12" fill="#000000" opacity="0.25"/>
    <!-- body -->
    <rect x="-46" y="-6" width="92" height="46" rx="12" fill="#1C2340" stroke="#2D9CDB" stroke-width="2.5"/>
    <!-- wheels -->
    <circle cx="-30" cy="44" r="12" fill="#0B0F2A" stroke="#2D9CDB" stroke-width="2"/>
    <circle cx="30" cy="44" r="12" fill="#0B0F2A" stroke="#2D9CDB" stroke-width="2"/>
    <!-- sensor mast -->
    <rect x="-6" y="-34" width="12" height="30" rx="4" fill="#1C2340" stroke="#00FCE2" stroke-width="2"/>
    <circle cx="0" cy="-40" r="10" fill="#0B0F2A" stroke="#00FCE2" stroke-width="2.5"/>
    <circle cx="0" cy="-40" r="3.4" fill="#00FCE2"/>
    <!-- status lights on body -->
    <circle cx="-24" cy="16" r="4" fill="#7DD3FC"/>
    <circle cx="-8" cy="16" r="4" fill="#7DD3FC"/>
    <circle cx="8" cy="16" r="4" fill="#7DD3FC"/>
  </g>

  <!-- sensor beam from robot's mast toward the rare scenario, narrowing to a capture point -->
  <path d="M 430 405 L 666 406" stroke="#00FCE2" stroke-width="2" stroke-dasharray="2 8" opacity="0.85"/>

  <!-- dashed route carrying the flagged moment up into a capture bin -->
  <path d="M 666 356 C 700 250, 760 150, 840 90" stroke="#00FCE2" stroke-width="2" stroke-dasharray="2 10" fill="none" opacity="0.8"/>

  <!-- capture bin: a small labeled folder/tray catching the flagged scenario -->
  <g transform="translate(900,70)">
    <path d="M -56 -4 L -56 28 A10 10 0 0 0 -46 38 L 46 38 A10 10 0 0 0 56 28 L 56 4 L 10 4 L 0 -10 L -46 -10 A10 10 0 0 0 -56 -4 Z" fill="#0B0F2A" stroke="#00FCE2" stroke-width="2.5"/>
    <circle cx="0" cy="16" r="9" fill="none" stroke="#00FCE2" stroke-width="2.5"/>
    <circle cx="0" cy="16" r="3" fill="#00FCE2"/>
  </g>
</svg>
