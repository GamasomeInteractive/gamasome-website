<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Radar-style comparison of two robot datasets across four axes: volume, embodiment coverage, scene diversity and task tail coverage, showing a high-volume single-lab dataset saturating only the volume axis while a balanced dataset covers all four">
  <rect x="0" y="0" width="760" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="28" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#14213d">The same episode budget, spent two ways</text>

  <!-- left: skewed -->
  <text x="90" y="66" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569">Single-lab · 40,000 episodes</text>
  <g transform="translate(190,200)">
    <g stroke="#e2e8f0" fill="none" stroke-width="1.5">
      <polygon points="0,-100 100,0 0,100 -100,0"/>
      <polygon points="0,-66 66,0 0,66 -66,0"/>
      <polygon points="0,-33 33,0 0,33 -33,0"/>
      <line x1="-100" y1="0" x2="100" y2="0"/><line x1="0" y1="-100" x2="0" y2="100"/>
    </g>
    <polygon points="0,-96 22,0 0,20 -18,0" fill="#d97706" fill-opacity="0.22" stroke="#d97706" stroke-width="2"/>
    <g font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b">
      <text x="-24" y="-108">VOLUME</text>
      <text x="106" y="4">EMBODIMENT</text>
      <text x="-22" y="122">SCENE</text>
      <text x="-158" y="4">TASK TAIL</text>
    </g>
  </g>

  <!-- right: balanced -->
  <text x="470" y="66" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569">Balanced · 40,000 episodes</text>
  <g transform="translate(560,200)">
    <g stroke="#e2e8f0" fill="none" stroke-width="1.5">
      <polygon points="0,-100 100,0 0,100 -100,0"/>
      <polygon points="0,-66 66,0 0,66 -66,0"/>
      <polygon points="0,-33 33,0 0,33 -33,0"/>
      <line x1="-100" y1="0" x2="100" y2="0"/><line x1="0" y1="-100" x2="0" y2="100"/>
    </g>
    <polygon points="0,-58 62,0 0,70 -66,0" fill="#0d9488" fill-opacity="0.22" stroke="#0d9488" stroke-width="2"/>
    <g font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b">
      <text x="-24" y="-108">VOLUME</text>
      <text x="106" y="4">EMBODIMENT</text>
      <text x="-22" y="122">SCENE</text>
      <text x="-158" y="4">TASK TAIL</text>
    </g>
  </g>

  <text x="28" y="338" font-family="sans-serif" font-size="12" fill="#94a3b8">Identical cost. The left dataset trains a policy for one room. The right one trains a policy that survives a customer site.</text>
</svg>
