<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Side-by-side loops comparing digital AI, which outputs to a screen, with physical AI, which acts on the world and senses the result">
<rect fill="#ffffff" height="330" rx="12" stroke="#e2e8f0" width="760"/>
<text fill="#2563eb" font-family="sans-serif" font-size="12" font-weight="600" x="30" y="38">DIGITAL AI LOOP</text>
<text fill="#d97706" font-family="sans-serif" font-size="12" font-weight="600" x="400" y="38">PHYSICAL AI LOOP</text>
<g fill="#14213d" font-family="sans-serif" font-size="13.5" text-anchor="middle">
<rect fill="#f8fafc" height="56" rx="8" stroke="#cbd5e1" width="140" x="40" y="70"/><text x="110" y="103">Prompt or data</text>
<rect fill="#f8fafc" height="56" rx="8" stroke="#cbd5e1" width="140" x="40" y="160"/><text x="110" y="193">Model</text>
<rect fill="#f8fafc" height="56" rx="8" stroke="#cbd5e1" width="140" x="40" y="250"/><text x="110" y="283">Screen output</text>
<rect fill="#eff6ff" height="56" rx="8" stroke="#2563eb" width="150" x="200" y="250"/><text x="275" y="276">Human reviews,</text><text x="275" y="294">edits, retries</text>
</g>
<path d="M110 126 V160 M110 216 V250 M180 278 H200" stroke="#2563eb" stroke-width="2" fill="none"/>
<g fill="#14213d" font-family="sans-serif" font-size="13.5" text-anchor="middle">
<rect fill="#f8fafc" height="56" rx="8" stroke="#cbd5e1" width="140" x="420" y="70"/><text x="490" y="103">Sensors</text>
<rect fill="#f8fafc" height="56" rx="8" stroke="#cbd5e1" width="140" x="590" y="160"/><text x="660" y="193">Policy</text>
<rect fill="#f8fafc" height="56" rx="8" stroke="#cbd5e1" width="140" x="420" y="250"/><text x="490" y="283">Actuators</text>
<rect fill="#fef3e2" height="56" rx="8" stroke="#d97706" width="170" x="400" y="160"/><text x="485" y="186">The world changes</text><text x="485" y="204">(no undo)</text>
</g>
<path d="M560 98 C630 98 660 120 660 160 M660 216 C660 260 600 278 560 278 M490 250 V216 M490 160 V126" fill="none" stroke="#d97706" stroke-width="2"/>
</svg>
