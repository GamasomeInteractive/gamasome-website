<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Circular data flywheel showing four repeating stages: collect demonstrations, score and review, retrain the policy, then deploy and observe, feeding back into collection">
  <defs><marker id="fw-ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker></defs>

  <!-- Arc segments -->
  <g fill="none" stroke-width="3">
    <path d="M406 118 A 140 140 0 0 1 490 202" stroke="#2563eb" marker-end="url(#fw-ah)"/>
    <path d="M490 278 A 140 140 0 0 1 406 362" stroke="#d97706" marker-end="url(#fw-ah)"/>
    <path d="M294 362 A 140 140 0 0 1 210 278" stroke="#0d9488" marker-end="url(#fw-ah)"/>
    <path d="M210 202 A 140 140 0 0 1 294 118" stroke="#4f46e5" marker-end="url(#fw-ah)"/>
  </g>

  <!-- Collect -->
  <circle cx="350" cy="100" r="54" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="350" y="98" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#14213d">Collect</text>
  <text x="350" y="116" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">demonstrations</text>

  <!-- Score -->
  <circle cx="550" cy="240" r="54" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="550" y="238" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#14213d">Score</text>
  <text x="550" y="256" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">every episode</text>

  <!-- Retrain -->
  <circle cx="350" cy="380" r="54" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
  <text x="350" y="378" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#14213d">Retrain</text>
  <text x="350" y="396" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">the policy</text>

  <!-- Deploy -->
  <circle cx="150" cy="240" r="54" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="150" y="238" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#14213d">Deploy</text>
  <text x="150" y="256" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">and observe</text>

  <!-- Hub -->
  <circle cx="350" cy="240" r="46" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="350" y="236" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#14213d">Data</text>
  <text x="350" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#14213d">flywheel</text>
</svg>
