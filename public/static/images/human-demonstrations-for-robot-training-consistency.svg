<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrative chart showing demonstration consistency dropping over a long operator session while task success stays flat">
<rect width="760" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="30" y="38" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#d97706">SUCCESS HIDES DRIFT (ILLUSTRATIVE)</text>
<line stroke="#cbd5e1" x1="70" x2="720" y1="240" y2="240"/><line stroke="#cbd5e1" x1="70" x2="70" y1="70" y2="240"/>
<polyline fill="none" points="70,90 200,92 330,91 460,93 590,92 720,94" stroke="#0d9488" stroke-width="2.5"/>
<polyline fill="none" points="70,100 200,104 330,122 460,152 590,178 720,200" stroke="#d97706" stroke-width="2.5"/>
<g fill="#64748b" font-family="sans-serif" font-size="11"><text x="70" y="262">start of session</text><text text-anchor="end" x="720" y="262">hours later</text></g>
<g font-family="sans-serif" font-size="13"><text fill="#0d9488" x="480" y="80">Task success rate</text><text fill="#d97706" x="520" y="168">Demonstration consistency</text></g>
</svg>
