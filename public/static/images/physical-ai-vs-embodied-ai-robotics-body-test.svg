<svg aria-label="Three-question Body Test flowchart that classifies a robotics project as embodied AI or broader physical AI work" role="img" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
<rect fill="#ffffff" height="330" rx="12" stroke="#e2e8f0" width="760"/>
<text fill="#d97706" font-family="monospace, sans-serif" font-size="12" font-weight="600" x="30" y="38" letter-spacing="0.06em">THE BODY TEST</text>
<g fill="#14213d" font-family="sans-serif" font-size="14">
<rect fill="#f8fafc" height="96" rx="9" stroke="#cbd5e1" width="210" x="30" y="66"/>
<text fill="#2563eb" font-family="monospace, sans-serif" font-size="11" font-weight="600" x="46" y="92">Q1</text>
<text x="46" y="116">Does the model's output</text><text x="46" y="136">drive an actuator?</text>
<rect fill="#f8fafc" height="96" rx="9" stroke="#cbd5e1" width="210" x="275" y="66"/>
<text fill="#2563eb" font-family="monospace, sans-serif" font-size="11" font-weight="600" x="291" y="92">Q2</text>
<text x="291" y="116">Does the training data</text><text x="291" y="136">come from that body?</text>
<rect fill="#f8fafc" height="96" rx="9" stroke="#cbd5e1" width="210" x="520" y="66"/>
<text fill="#2563eb" font-family="monospace, sans-serif" font-size="11" font-weight="600" x="536" y="92">Q3</text>
<text x="536" y="116">Does a mistake have a</text><text x="536" y="136">physical cost?</text>
</g>
<path d="M240 114 H275 M485 114 H520" stroke="#d97706" stroke-width="2"/>
<g fill="#334155" font-family="sans-serif" font-size="13.5">
<rect fill="rgba(217,119,6,0.08)" height="100" rx="9" stroke="#d97706" width="335" x="30" y="200"/>
<text fill="#14213d" font-family="sans-serif" font-size="15" font-weight="600" x="48" y="228">Yes, yes, yes: embodied AI</text>
<text x="48" y="254">Budget for on-robot episodes, calibration,</text><text x="48" y="274">safety envelopes, and recovery data.</text>
<rect fill="rgba(37,99,235,0.08)" height="100" rx="9" stroke="#2563eb" width="335" x="395" y="200"/>
<text fill="#14213d" font-family="sans-serif" font-size="15" font-weight="600" x="413" y="228">Any "no": wider physical AI</text>
<text x="413" y="254">Budget for sim assets, video, world models,</text><text x="413" y="274">telemetry, and cross-embodiment transfer.</text>
</g>
</svg>
