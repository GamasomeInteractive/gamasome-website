<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Side by side comparison of an unlabeled street scene and the same scene with bounding boxes and class tags applied around a pedestrian, a vehicle, and a traffic light">
  <defs>
    <linearGradient id="daBg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#e9f0ff"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient>
    <marker id="daArrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="760" height="300" fill="url(#daBg)"/>

  <!-- left panel: raw -->
  <rect x="40" y="52" width="300" height="216" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1.5"/>
  <text x="58" y="78" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#94a3b8">RAW, UNLABELED</text>
  <g fill="#cbd5e1">
    <rect x="60" y="198" width="260" height="5" rx="2.5"/>
    <circle cx="100" cy="170" r="17"/>
    <rect x="88" y="190" width="24" height="8" rx="3"/>
    <rect x="170" y="150" width="80" height="48" rx="6"/>
    <rect x="282" y="122" width="15" height="76" rx="3"/>
    <circle cx="289.5" cy="115" r="9"/>
  </g>

  <!-- transition arrow -->
  <line x1="352" y1="160" x2="390" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#daArrow)"/>
  <text x="371" y="146" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#2563eb">annotate</text>

  <!-- right panel: annotated -->
  <rect x="400" y="52" width="320" height="216" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1.5"/>
  <text x="418" y="78" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#2563eb">ANNOTATED</text>
  <g fill="#cbd5e1">
    <rect x="420" y="198" width="280" height="5" rx="2.5"/>
    <circle cx="460" cy="170" r="17"/>
    <rect x="448" y="190" width="24" height="8" rx="3"/>
    <rect x="530" y="150" width="80" height="48" rx="6"/>
    <rect x="642" y="122" width="15" height="76" rx="3"/>
    <circle cx="649.5" cy="115" r="9"/>
  </g>
  <rect x="437" y="147" width="46" height="61" rx="3" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="437" y="141" font-family="sans-serif" font-size="10" font-weight="600" fill="#2563eb">pedestrian</text>
  <rect x="524" y="144" width="92" height="60" rx="3" fill="none" stroke="#4f46e5" stroke-width="2"/>
  <text x="524" y="138" font-family="sans-serif" font-size="10" font-weight="600" fill="#4f46e5">vehicle</text>
  <rect x="634" y="104" width="31" height="100" rx="3" fill="none" stroke="#0d9488" stroke-width="2"/>
  <text x="634" y="98" font-family="sans-serif" font-size="10" font-weight="600" fill="#0d9488">traffic_light</text>

  <text x="380" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Annotation is the step that turns raw data into the ground truth a model can learn from.</text>
</svg>
