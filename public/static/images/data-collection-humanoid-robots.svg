<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a bipedal humanoid robot mid-stride, holding a box in one hand and a cylinder in the other, with glowing joint nodes at shoulders, elbows, wrists, hips, knees and ankles and data particles radiating from its whole body, representing data collection for humanoid robots">
  <defs>
    <linearGradient id="dchr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07091B"/><stop offset="1" stop-color="#000B71"/>
    </linearGradient>
    <radialGradient id="dchr-glow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#2D9CDB" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2D9CDB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dchr-node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FCE2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00FCE2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dchr-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#dchr-bg)"/>
  <rect width="1200" height="630" fill="url(#dchr-glow)"/>
  <rect x="0" y="515" width="1200" height="115" fill="url(#dchr-floor)"/>

  <!-- floor grid with perspective -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="515" x2="1200" y2="515"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    <line x1="0" y1="592" x2="1200" y2="592"/>
    <line x1="600" y1="515" x2="200" y2="630"/>
    <line x1="600" y1="515" x2="1000" y2="630"/>
    <line x1="600" y1="515" x2="420" y2="630"/>
    <line x1="600" y1="515" x2="780" y2="630"/>
  </g>

  <!-- human-scale context: stair steps at right, doorway frame at left -->
  <g fill="none" stroke="#2D9CDB" stroke-opacity="0.35" stroke-width="2">
    <path d="M 900 515 L 900 480 L 960 480 L 960 445 L 1020 445 L 1020 410 L 1080 410 L 1080 375 L 1200 375"/>
    <path d="M 150 515 L 150 190 L 300 190 L 300 515"/>
  </g>
  <rect x="160" y="200" width="130" height="315" fill="#2D9CDB" opacity="0.04"/>

  <!-- background ambient data points -->
  <g fill="#7DD3FC" opacity="0.45">
    <circle cx="90" cy="110" r="2.5"/>
    <circle cx="240" cy="70" r="2"/>
    <circle cx="1060" cy="120" r="2.5"/>
    <circle cx="1130" cy="200" r="2"/>
    <circle cx="70" cy="330" r="2"/>
    <circle cx="1150" cy="300" r="2"/>
    <circle cx="380" cy="60" r="1.8"/>
    <circle cx="840" cy="50" r="1.8"/>
  </g>

  <!-- support polygon / balance footprint -->
  <ellipse cx="600" cy="514" rx="130" ry="16" fill="#000000" opacity="0.3"/>
  <ellipse cx="600" cy="514" rx="118" ry="12" fill="none" stroke="#00FCE2" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- radiating data rays from the whole body -->
  <g stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="2 9">
    <path d="M 455 240 L 340 170" stroke="#00FCE2" opacity="0.75"/>
    <path d="M 745 235 L 870 160" stroke="#00FCE2" opacity="0.75"/>
    <path d="M 565 200 L 470 110" stroke="#7DD3FC" opacity="0.6"/>
    <path d="M 635 200 L 730 105" stroke="#7DD3FC" opacity="0.6"/>
    <path d="M 600 150 L 600 40" stroke="#7DD3FC" opacity="0.55"/>
    <path d="M 510 262 L 380 300" stroke="#2D9CDB" opacity="0.7"/>
    <path d="M 690 265 L 820 305" stroke="#2D9CDB" opacity="0.7"/>
    <path d="M 580 335 L 440 380" stroke="#00FCE2" opacity="0.7"/>
    <path d="M 620 335 L 770 375" stroke="#00FCE2" opacity="0.7"/>
    <path d="M 560 420 L 420 450" stroke="#7DD3FC" opacity="0.65"/>
    <path d="M 640 415 L 790 440" stroke="#7DD3FC" opacity="0.65"/>
    <path d="M 535 505 L 390 500" stroke="#00FCE2" opacity="0.7"/>
    <path d="M 668 500 L 820 492" stroke="#00FCE2" opacity="0.7"/>
  </g>

  <!-- particles along ray ends -->
  <g fill="#00FCE2">
    <circle cx="330" cy="164" r="4"/><circle cx="880" cy="154" r="4"/>
    <circle cx="430" cy="384" r="4"/><circle cx="780" cy="378" r="4"/>
    <circle cx="380" cy="500" r="4"/><circle cx="830" cy="491" r="4"/>
  </g>
  <g fill="#7DD3FC">
    <circle cx="462" cy="102" r="3.2"/><circle cx="738" cy="97" r="3.2"/>
    <circle cx="600" cy="32" r="3.2"/><circle cx="410" cy="452" r="3.2"/>
    <circle cx="800" cy="442" r="3.2"/>
  </g>
  <g fill="#2D9CDB">
    <circle cx="370" cy="303" r="3.6"/><circle cx="830" cy="308" r="3.6"/>
  </g>
  <g fill="#7DD3FC" opacity="0.6">
    <circle cx="360" cy="230" r="2"/><circle cx="845" cy="230" r="2"/>
    <circle cx="470" cy="420" r="2"/><circle cx="735" cy="410" r="2"/>
    <circle cx="455" cy="480" r="2"/><circle cx="752" cy="472" r="2"/>
    <circle cx="520" cy="80" r="2"/><circle cx="680" cy="75" r="2"/>
  </g>

  <!-- HUMANOID -->
  <!-- back leg (right) -->
  <path d="M 620 335 L 640 415 L 668 500" stroke="#C9D3E6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 660 504 L 700 508" stroke="#C9D3E6" stroke-width="12" stroke-linecap="round"/>
  <!-- back arm (right) -->
  <path d="M 635 200 L 690 265 L 745 235" stroke="#C9D3E6" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- pelvis -->
  <rect x="568" y="310" width="64" height="40" rx="14" fill="#E7ECF5"/>
  <!-- torso -->
  <path d="M 556 188 C 556 178, 566 172, 578 172 L 622 172 C 634 172, 644 178, 644 188 L 636 300 C 635 312, 626 318, 614 318 L 586 318 C 574 318, 565 312, 564 300 Z" fill="#E7ECF5"/>
  <rect x="582" y="210" width="36" height="52" rx="8" fill="#1C2340" stroke="#2D9CDB" stroke-width="2"/>
  <circle cx="600" cy="236" r="7" fill="#00FCE2" opacity="0.85"/>
  <!-- neck and head -->
  <rect x="592" y="156" width="16" height="20" rx="5" fill="#C9D3E6"/>
  <rect x="574" y="112" width="52" height="50" rx="18" fill="#E7ECF5"/>
  <rect x="582" y="126" width="36" height="16" rx="8" fill="#0B0F2A" stroke="#00FCE2" stroke-width="2"/>
  <circle cx="600" cy="134" r="3.4" fill="#00FCE2"/>

  <!-- front leg (left), stepping forward -->
  <path d="M 580 335 L 560 420 L 535 505" stroke="#E7ECF5" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 545 508 L 500 510" stroke="#E7ECF5" stroke-width="13" stroke-linecap="round"/>
  <!-- front arm (left) -->
  <path d="M 565 200 L 510 262 L 455 240" stroke="#E7ECF5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- object in left hand: box -->
  <g transform="translate(418,212)">
    <rect x="0" y="0" width="44" height="40" rx="5" fill="#1C2340" stroke="#2D9CDB" stroke-width="2"/>
    <path d="M 0 14 L 44 14" stroke="#2D9CDB" stroke-width="1.5" opacity="0.7"/>
    <rect x="14" y="20" width="16" height="12" rx="3" fill="#2D9CDB" opacity="0.8"/>
  </g>
  <!-- left hand fingers -->
  <path d="M 452 236 L 462 224 M 452 244 L 464 252" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round"/>

  <!-- object in right hand: cylinder -->
  <g transform="translate(748,196)">
    <ellipse cx="0" cy="0" rx="16" ry="6" fill="#0B0F2A" stroke="#00FCE2" stroke-width="2"/>
    <path d="M -16 0 L -16 44 A16 6 0 0 0 16 44 L 16 0" fill="#0B0F2A" stroke="#00FCE2" stroke-width="2"/>
    <path d="M -16 22 A16 6 0 0 0 16 22" fill="none" stroke="#00FCE2" stroke-width="1.4" opacity="0.6"/>
  </g>
  <path d="M 742 230 L 734 222 M 744 240 L 734 248" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round"/>

  <!-- center of mass marker and balance arc -->
  <circle cx="600" cy="300" r="9" fill="none" stroke="#7DD3FC" stroke-width="2"/>
  <path d="M 591 300 L 609 300 M 600 291 L 600 309" stroke="#7DD3FC" stroke-width="1.6"/>
  <path d="M 600 309 L 600 500" stroke="#7DD3FC" stroke-width="1.4" stroke-dasharray="3 7" opacity="0.6"/>

  <!-- glowing joint nodes -->
  <g>
    <circle cx="565" cy="200" r="16" fill="url(#dchr-node)"/>
    <circle cx="635" cy="200" r="16" fill="url(#dchr-node)"/>
    <circle cx="510" cy="262" r="15" fill="url(#dchr-node)"/>
    <circle cx="690" cy="265" r="15" fill="url(#dchr-node)"/>
    <circle cx="455" cy="240" r="15" fill="url(#dchr-node)"/>
    <circle cx="745" cy="235" r="15" fill="url(#dchr-node)"/>
    <circle cx="580" cy="335" r="16" fill="url(#dchr-node)"/>
    <circle cx="620" cy="335" r="16" fill="url(#dchr-node)"/>
    <circle cx="560" cy="420" r="16" fill="url(#dchr-node)"/>
    <circle cx="640" cy="415" r="16" fill="url(#dchr-node)"/>
    <circle cx="535" cy="505" r="15" fill="url(#dchr-node)"/>
    <circle cx="668" cy="500" r="15" fill="url(#dchr-node)"/>
  </g>
  <g fill="#0B0F2A" stroke="#00FCE2" stroke-width="2.5">
    <circle cx="565" cy="200" r="6.5"/>
    <circle cx="635" cy="200" r="6.5"/>
    <circle cx="510" cy="262" r="6"/>
    <circle cx="690" cy="265" r="6"/>
    <circle cx="455" cy="240" r="6"/>
    <circle cx="745" cy="235" r="6"/>
    <circle cx="580" cy="335" r="6.5"/>
    <circle cx="620" cy="335" r="6.5"/>
    <circle cx="560" cy="420" r="6.5"/>
    <circle cx="640" cy="415" r="6.5"/>
    <circle cx="535" cy="505" r="6"/>
    <circle cx="668" cy="500" r="6"/>
  </g>
</svg>
