<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reinforcement learning loop on a robot showing state, action, environment, and the four possible sources of reward">
  <rect x="0" y="0" width="760" height="320" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="34" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#d97706">THE RL LOOP, AND WHERE REWARD COMES FROM</text>

  <rect x="50" y="108" width="150" height="60" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="125" y="144" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#14213d">Policy (robot)</text>

  <rect x="320" y="108" width="150" height="60" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="395" y="144" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#14213d">Environment</text>

  <path d="M200 123 H320" stroke="#d97706" stroke-width="2"/>
  <text x="260" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d97706">action</text>

  <path d="M320 158 H200" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="183" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2563eb">new state + reward</text>

  <text x="520" y="78" font-family="sans-serif" font-size="11" font-weight="700" fill="#0d9488">REWARD SOURCES</text>

  <rect x="520" y="90" width="210" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="534" y="115" font-family="sans-serif" font-size="12.5" fill="#14213d">Hand-designed (sim physics)</text>

  <rect x="520" y="138" width="210" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="534" y="163" font-family="sans-serif" font-size="12.5" fill="#14213d">Task success detector</text>

  <rect x="520" y="186" width="210" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="534" y="211" font-family="sans-serif" font-size="12.5" fill="#14213d">Human corrections</text>

  <rect x="520" y="234" width="210" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="534" y="259" font-family="sans-serif" font-size="12.5" fill="#14213d">Learned value function</text>

  <path d="M470 138 H520" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>
