<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Six-row diagram titled the sensor selection ladder, showing the camera, depth or stereo camera, LiDAR, IMU, force-torque sensor, and tactile sensor, each paired with the question it answers and a cost or complexity tag">
  <rect x="0" y="0" width="900" height="560" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#14213d">The sensor selection ladder</text>

  <!-- axis labels -->
  <text x="840" y="56" font-family="sans-serif" font-size="10" fill="#2563eb" text-anchor="end">LOWEST COST</text>
  <text x="840" y="528" font-family="sans-serif" font-size="10" fill="#dc2626" text-anchor="end">MOST PRECISE / CONTACT-CRITICAL</text>
  <line x1="818" y1="62" x2="818" y2="500" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 818 62 L 812 72 L 824 72 Z" fill="#2563eb"/>
  <path d="M 818 500 L 812 490 L 824 490 Z" fill="#dc2626"/>

  <!-- Row 1: Camera -->
  <rect x="30" y="56" width="760" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="80" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563eb">01 · CAMERA</text>
  <text x="50" y="104" font-family="sans-serif" font-size="15.5" font-weight="700" fill="#14213d">What does it look like?</text>
  <text x="780" y="94" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="end">cheapest, almost always on</text>

  <!-- Row 2: Depth / stereo -->
  <rect x="30" y="132" width="760" height="68" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <text x="50" y="156" font-family="sans-serif" font-size="10" font-weight="700" fill="#0d9488">02 · DEPTH / STEREO CAMERA</text>
  <text x="50" y="180" font-family="sans-serif" font-size="15.5" font-weight="700" fill="#14213d">How far away is it, up close?</text>
  <text x="780" y="170" font-family="sans-serif" font-size="11" fill="#0d9488" text-anchor="end">short-range manipulation</text>

  <!-- Row 3: LiDAR -->
  <rect x="30" y="208" width="760" height="68" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="50" y="232" font-family="sans-serif" font-size="10" font-weight="700" fill="#d97706">03 · LIDAR</text>
  <text x="50" y="256" font-family="sans-serif" font-size="15.5" font-weight="700" fill="#14213d">How far away is it, at range or outdoors?</text>
  <text x="780" y="246" font-family="sans-serif" font-size="11" fill="#d97706" text-anchor="end">highest hardware cost tier</text>

  <!-- Row 4: IMU -->
  <rect x="30" y="284" width="760" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="50" y="308" font-family="sans-serif" font-size="10" font-weight="700" fill="#475569">04 · IMU</text>
  <text x="50" y="332" font-family="sans-serif" font-size="15.5" font-weight="700" fill="#14213d">Which way is it moving, right now?</text>
  <text x="780" y="322" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">fast, cheap, drifts alone</text>

  <!-- Row 5: Force-torque -->
  <rect x="30" y="360" width="760" height="68" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="50" y="384" font-family="sans-serif" font-size="10" font-weight="700" fill="#dc2626">05 · FORCE / TORQUE</text>
  <text x="50" y="408" font-family="sans-serif" font-size="15.5" font-weight="700" fill="#14213d">How hard is it pushing?</text>
  <text x="780" y="398" font-family="sans-serif" font-size="11" fill="#dc2626" text-anchor="end">contact-critical</text>

  <!-- Row 6: Tactile -->
  <rect x="30" y="436" width="760" height="68" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
  <text x="50" y="460" font-family="sans-serif" font-size="10" font-weight="700" fill="#dc2626">06 · TACTILE</text>
  <text x="50" y="484" font-family="sans-serif" font-size="15.5" font-weight="700" fill="#14213d">What exactly is touching, and is it slipping?</text>
  <text x="780" y="474" font-family="sans-serif" font-size="11" fill="#dc2626" text-anchor="end">emerging, finest detail</text>

  <line x1="30" y1="516" x2="790" y2="516" stroke="#e2e8f0"/>
  <text x="30" y="538" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Most capture rigs combine four or more rows. None of them substitutes for another.</text>
</svg>
