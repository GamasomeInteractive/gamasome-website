<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of three hospital zones by environmental control: the procedural suite as a fully controlled cell, the logistics corridor as a shared uncontrolled space, and the care-adjacent bedside zone where consent and dignity constraints apply">
  <rect x="0" y="0" width="760" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="28" y="36" font-family="sans-serif" font-size="13" font-weight="700" fill="#14213d">Zones by environmental control</text>

  <!-- Zone 1 -->
  <rect x="28" y="56" width="228" height="276" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="46" y="82" font-family="sans-serif" font-size="10" font-weight="700" fill="#0d9488">ZONE 01 — PROCEDURAL</text>
  <text x="46" y="108" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Operating suite</text>
  <rect x="58" y="126" width="168" height="72" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="96" cy="162" r="14" fill="none" stroke="#0d9488" stroke-width="1.6"/>
  <path d="M 128 178 L 148 146 L 168 164 L 188 142" stroke="#0d9488" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="46" y="228" font-family="sans-serif" font-size="12" fill="#475569">Fixed setup. Trained operator.</text>
  <text x="46" y="246" font-family="sans-serif" font-size="12" fill="#475569">No unplanned traffic.</text>
  <text x="46" y="284" font-family="sans-serif" font-size="10" font-weight="700" fill="#0d9488">CONTROL: HIGH</text>
  <text x="46" y="300" font-family="sans-serif" font-size="10" fill="#94a3b8">maturity: established</text>

  <!-- Zone 2 -->
  <rect x="266" y="56" width="228" height="276" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="284" y="82" font-family="sans-serif" font-size="10" font-weight="700" fill="#d97706">ZONE 02 — CORRIDOR</text>
  <text x="284" y="108" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Logistics routes</text>
  <rect x="296" y="126" width="168" height="72" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <path d="M 308 190 L 308 138 L 452 138" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" fill="none"/>
  <rect x="316" y="146" width="18" height="26" rx="2" fill="none" stroke="#d97706" stroke-width="1.3"/>
  <text x="342" y="164" font-family="sans-serif" font-size="8" font-weight="700" fill="#d97706">ELEVATOR</text>
  <rect x="404" y="158" width="36" height="20" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="344" y="190" font-family="sans-serif" font-size="8" font-weight="700" fill="#94a3b8">BADGE DOOR</text>
  <text x="284" y="228" font-family="sans-serif" font-size="12" fill="#475569">Shared with everyone.</text>
  <text x="284" y="246" font-family="sans-serif" font-size="12" fill="#475569">Building fights the robot.</text>
  <text x="284" y="284" font-family="sans-serif" font-size="10" font-weight="700" fill="#d97706">CONTROL: LOW</text>
  <text x="284" y="300" font-family="sans-serif" font-size="10" fill="#94a3b8">maturity: contested</text>

  <!-- Zone 3 -->
  <rect x="504" y="56" width="228" height="276" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="522" y="82" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563eb">ZONE 03 — BEDSIDE</text>
  <text x="522" y="108" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Care-adjacent</text>
  <rect x="534" y="126" width="168" height="72" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="548" y="150" width="64" height="32" rx="3" fill="none" stroke="#2563eb" stroke-width="1.4"/>
  <circle cx="648" cy="154" r="10" fill="none" stroke="#2563eb" stroke-width="1.4"/>
  <path d="M 640 182 q 8 -10 16 0" stroke="#2563eb" stroke-width="1.4" fill="none"/>
  <text x="522" y="228" font-family="sans-serif" font-size="12" fill="#475569">Consent, dignity, privacy</text>
  <text x="522" y="246" font-family="sans-serif" font-size="12" fill="#475569">govern what is possible.</text>
  <text x="522" y="284" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563eb">CONTROL: CONDITIONAL</text>
  <text x="522" y="300" font-family="sans-serif" font-size="10" fill="#94a3b8">maturity: early</text>
</svg>
