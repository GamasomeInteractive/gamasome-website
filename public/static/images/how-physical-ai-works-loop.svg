<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Six-layer physical AI loop: sense, perceive, reason, act, control, and learn, with the world closing the loop">
<rect fill="#ffffff" height="380" rx="12" stroke="#e2e8f0" width="760"/>
<text fill="#d97706" font-family="sans-serif" font-size="12" font-weight="600" x="30" y="38">THE SIX-LAYER LOOP</text>
<circle cx="380" cy="205" fill="#fef3e2" r="62" stroke="#d97706"/>
<text fill="#14213d" font-family="sans-serif" font-size="16" text-anchor="middle" x="380" y="200">The world</text>
<text fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="middle" x="380" y="220">changes every step</text>
<g fill="#14213d" font-family="sans-serif" font-size="13.5" text-anchor="middle">
<rect fill="#f8fafc" height="48" rx="8" stroke="#2563eb" width="160" x="300" y="60"/><text fill="#2563eb" font-family="sans-serif" font-size="11" x="380" y="80">1</text><text x="380" y="98">Sense</text>
<rect fill="#f8fafc" height="48" rx="8" stroke="#2563eb" width="170" x="540" y="110"/><text fill="#2563eb" font-family="sans-serif" font-size="11" x="625" y="130">2</text><text x="625" y="148">Perceive</text>
<rect fill="#f8fafc" height="48" rx="8" stroke="#2563eb" width="170" x="540" y="250"/><text fill="#2563eb" font-family="sans-serif" font-size="11" x="625" y="270">3</text><text x="625" y="288">Reason and plan</text>
<rect fill="#f8fafc" height="48" rx="8" stroke="#2563eb" width="160" x="300" y="305"/><text fill="#2563eb" font-family="sans-serif" font-size="11" x="380" y="325">4</text><text x="380" y="343">Act (policy)</text>
<rect fill="#f8fafc" height="48" rx="8" stroke="#2563eb" width="170" x="50" y="250"/><text fill="#2563eb" font-family="sans-serif" font-size="11" x="135" y="270">5</text><text x="135" y="288">Control</text>
<rect fill="#f8fafc" height="48" rx="8" stroke="#0d9488" width="170" x="50" y="110"/><text fill="#0d9488" font-family="sans-serif" font-size="11" x="135" y="130">6</text><text x="135" y="148">Learn</text>
</g>
<path d="M460 84 C520 84 600 90 610 110 M625 158 V250 M540 290 C500 320 480 328 460 329 M300 329 C260 329 230 310 220 298 M135 250 V158 M220 120 C250 90 280 84 300 84" fill="none" stroke="#d97706" stroke-width="2"/>
</svg>
