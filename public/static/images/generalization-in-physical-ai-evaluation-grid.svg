<rect fill="#ffffff" height="44" rx="6" stroke="#cbd5e1" width="140" x="200" y="164"/><text fill="#475569" x="270" y="191">Rung 3 test</text>
<rect fill="rgba(217,119,6,0.12)" height="44" rx="6" stroke="#d97706" width="140" x="350" y="164"/><text fill="#14213d" x="420" y="191">Deployment proxy</text>
<rect fill="#ffffff" height="44" rx="6" stroke="#cbd5e1" width="140" x="500" y="164"/><text fill="#475569" x="570" y="191">Stretch test</text>
<rect fill="#ffffff" height="44" rx="6" stroke="#cbd5e1" width="440" x="200" y="234"/><text fill="#475569" x="420" y="261">Rung 5 test (only if cross-embodiment matters)</text>
