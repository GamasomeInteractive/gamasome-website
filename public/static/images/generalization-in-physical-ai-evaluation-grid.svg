<text x="30" y="38" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#d97706">HONEST EVALUATION SPLITS</text>
<g fill="#64748b" font-family="sans-serif" font-size="11.5" text-anchor="middle"><text x="270" y="74">Seen objects</text><text x="420" y="74">New objects</text><text x="570" y="74">New instructions</text></g>
<g fill="#14213d" font-family="sans-serif" font-size="13.5"><text x="40" y="118">Seen scenes</text><text x="40" y="188">New scenes</text><text x="40" y="258">New robot</text></g>
<g font-family="sans-serif" font-size="12" text-anchor="middle">
<rect fill="rgba(37,99,235,0.1)" height="44" rx="6" stroke="#2563eb" width="140" x="200" y="94"/><text fill="#14213d" x="270" y="121">Train + sanity</text>
