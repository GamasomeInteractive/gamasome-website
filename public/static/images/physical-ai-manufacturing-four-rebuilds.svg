<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Layered diagram showing the four rebuilds of a smart factory: the cell layer, the line layer, the data spine, and the role layer, with the data spine shown as the connecting foundation">
  <rect x="0" y="0" width="760" height="340" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="28" y="36" font-family="sans-serif" font-size="13" font-weight="700" fill="#14213d">The four rebuilds</text>

  <!-- Rebuild 04 role -->
  <rect x="28" y="52" width="704" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="46" y="74" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563eb">REBUILD 04</text>
  <text x="46" y="92" font-family="sans-serif" font-size="14" font-weight="700" fill="#14213d">The role — operators become supervisors, technicians become data owners</text>

  <!-- Rebuild 01 cell -->
  <rect x="28" y="118" width="344" height="76" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <text x="46" y="140" font-family="sans-serif" font-size="10" font-weight="700" fill="#0d9488">REBUILD 01</text>
  <text x="46" y="160" font-family="sans-serif" font-size="14" font-weight="700" fill="#14213d">The cell</text>
  <text x="46" y="180" font-family="sans-serif" font-size="12" fill="#475569">sensing, calibration, safety envelope</text>

  <!-- Rebuild 02 line -->
  <rect x="388" y="118" width="344" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="406" y="140" font-family="sans-serif" font-size="10" font-weight="700" fill="#d97706">REBUILD 02</text>
  <text x="406" y="160" font-family="sans-serif" font-size="14" font-weight="700" fill="#14213d">The line</text>
  <text x="406" y="180" font-family="sans-serif" font-size="12" fill="#475569">sequencing, buffering, exception routing</text>

  <!-- Rebuild 03 data spine -->
  <rect x="28" y="208" width="704" height="92" rx="8" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="46" y="232" font-family="sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">REBUILD 03 — LOAD-BEARING</text>
  <text x="46" y="256" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">The data spine</text>
  <text x="46" y="278" font-family="sans-serif" font-size="12" fill="#475569">unified, time-synchronized production data · calibration records · simulation assets · evaluation sets</text>

  <!-- connectors -->
  <path d="M 200 194 L 200 208" stroke="#0d9488" stroke-width="2"/>
  <path d="M 560 194 L 560 208" stroke="#d97706" stroke-width="2"/>
  <path d="M 380 104 L 380 118" stroke="#2563eb" stroke-width="2"/>
</svg>
