<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four-stage funnel showing raw robot episodes narrowing as they pass through structural integrity, annotation consistency, diversity coverage, and downstream validation gates, with episodes that fail each gate branching off, ending in a smaller trainable dataset on the right">
  <rect x="0" y="0" width="900" height="460" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#14213d">The four quality gates</text>

  <!-- raw episodes, left -->
  <text x="30" y="68" font-family="sans-serif" font-size="10" font-weight="700" fill="#475569">RAW EPISODES</text>
  <g fill="#94a3b8">
    <rect x="30" y="80" width="18" height="18" rx="3"/>
    <rect x="30" y="104" width="18" height="18" rx="3"/>
    <rect x="30" y="128" width="18" height="18" rx="3"/>
    <rect x="30" y="152" width="18" height="18" rx="3"/>
    <rect x="30" y="176" width="18" height="18" rx="3"/>
    <rect x="30" y="200" width="18" height="18" rx="3"/>
  </g>

  <!-- gate 1 -->
  <rect x="110" y="70" width="150" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="92" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#2563eb" text-anchor="middle">GATE 01</text>
  <text x="185" y="112" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#14213d" text-anchor="middle">Structural</text>
  <text x="185" y="128" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#14213d" text-anchor="middle">integrity</text>
  <text x="185" y="200" font-family="sans-serif" font-size="9" fill="#2563eb" text-anchor="middle">timestamps, shapes</text>

  <path d="M 260 145 L 290 145" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 290 145 L 282 140 L 282 150 Z" fill="#cbd5e1"/>
  <path d="M 260 170 L 275 210" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="250" y="230" font-family="sans-serif" font-size="8.5" fill="#dc2626">fails: fixed or dropped</text>

  <!-- gate 2 -->
  <rect x="300" y="70" width="150" height="150" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="375" y="92" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0d9488" text-anchor="middle">GATE 02</text>
  <text x="375" y="112" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#14213d" text-anchor="middle">Annotation</text>
  <text x="375" y="128" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#14213d" text-anchor="middle">consistency</text>
  <text x="375" y="200" font-family="sans-serif" font-size="9" fill="#0d9488" text-anchor="middle">measured agreement</text>

  <path d="M 450 145 L 480 145" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 480 145 L 472 140 L 472 150 Z" fill="#cbd5e1"/>
  <path d="M 450 170 L 465 210" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="430" y="230" font-family="sans-serif" font-size="8.5" fill="#dc2626">fails: re-labeled</text>

  <!-- gate 3 -->
  <rect x="490" y="70" width="150" height="150" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="565" y="92" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#d97706" text-anchor="middle">GATE 03</text>
  <text x="565" y="112" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#14213d" text-anchor="middle">Diversity</text>
  <text x="565" y="128" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#14213d" text-anchor="middle">coverage</text>
  <text x="565" y="200" font-family="sans-serif" font-size="9" fill="#d97706" text-anchor="middle">planned, not accidental</text>

  <path d="M 640 145 L 670 145" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 670 145 L 662 140 L 662 150 Z" fill="#cbd5e1"/>
  <path d="M 640 170 L 655 210" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="615" y="230" font-family="sans-serif" font-size="8.5" fill="#dc2626">fails: cell flagged, more collected</text>

  <!-- gate 4 -->
  <rect x="680" y="70" width="150" height="150" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="755" y="92" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">GATE 04</text>
  <text x="755" y="112" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#14213d" text-anchor="middle">Downstream</text>
  <text x="755" y="128" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#14213d" text-anchor="middle">validation</text>
  <text x="755" y="200" font-family="sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">held-out loss check</text>

  <!-- trainable dataset -->
  <text x="852" y="60" font-family="sans-serif" font-size="9" font-weight="700" fill="#14213d" text-anchor="middle" transform="rotate(0)"></text>
  <g transform="translate(846,130)">
    <rect x="-16" y="0" width="32" height="10" rx="2" fill="none" stroke="#14213d" stroke-width="2"/>
    <rect x="-16" y="12" width="32" height="10" rx="2" fill="none" stroke="#14213d" stroke-width="2"/>
    <rect x="-16" y="24" width="32" height="10" rx="2" fill="none" stroke="#14213d" stroke-width="2"/>
  </g>
  <path d="M 830 145 L 856 145" stroke="#14213d" stroke-width="2"/>
  <path d="M 856 145 L 848 140 L 848 150 Z" fill="#14213d"/>
  <text x="846" y="200" font-family="sans-serif" font-size="9" font-weight="700" fill="#14213d" text-anchor="middle">trainable</text>
  <text x="846" y="212" font-family="sans-serif" font-size="9" font-weight="700" fill="#14213d" text-anchor="middle">dataset</text>

  <line x1="30" y1="400" x2="870" y2="400" stroke="#e2e8f0"/>
  <text x="30" y="424" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Most programs only enforce gate one. The episodes that clear all four are usually a fraction of what was recorded.</text>
</svg>
