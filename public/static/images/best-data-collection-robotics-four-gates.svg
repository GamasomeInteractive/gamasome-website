<svg viewBox="0 0 1060 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of the Four Gates framework: raw collected hours pass through embodiment match, sync integrity, failure coverage, and handoff format to become training-ready data, with a rejected failure mode noted under each gate">
  <rect x="0" y="0" width="1060" height="260" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#14213d">The Four Gates</text>

  <rect x="30" y="98" width="112" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="86" y="126" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">COLLECTED</text>
  <text x="86" y="143" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">HOURS</text>

  <line x1="142" y1="131" x2="182" y2="131" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="182" y="88" width="164" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="264" y="112" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">GATE 1</text>
  <text x="264" y="134" font-family="sans-serif" font-size="15" fill="#14213d" text-anchor="middle" font-weight="700">Embodiment</text>
  <text x="264" y="153" font-family="sans-serif" font-size="15" fill="#14213d" text-anchor="middle" font-weight="700">match</text>

  <line x1="346" y1="131" x2="386" y2="131" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="386" y="88" width="164" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="468" y="112" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">GATE 2</text>
  <text x="468" y="134" font-family="sans-serif" font-size="15" fill="#14213d" text-anchor="middle" font-weight="700">Sync</text>
  <text x="468" y="153" font-family="sans-serif" font-size="15" fill="#14213d" text-anchor="middle" font-weight="700">integrity</text>

  <line x1="550" y1="131" x2="590" y2="131" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="590" y="88" width="164" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="672" y="112" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">GATE 3</text>
  <text x="672" y="134" font-family="sans-serif" font-size="15" fill="#14213d" text-anchor="middle" font-weight="700">Failure</text>
  <text x="672" y="153" font-family="sans-serif" font-size="15" fill="#14213d" text-anchor="middle" font-weight="700">coverage</text>

  <line x1="754" y1="131" x2="794" y2="131" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="794" y="88" width="164" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="876" y="112" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">GATE 4</text>
  <text x="876" y="134" font-family="sans-serif" font-size="15" fill="#14213d" text-anchor="middle" font-weight="700">Handoff</text>
  <text x="876" y="153" font-family="sans-serif" font-size="15" fill="#14213d" text-anchor="middle" font-weight="700">format</text>

  <line x1="958" y1="131" x2="990" y2="131" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="1010" cy="131" r="19" fill="none" stroke="#0d9488" stroke-width="1.8"/>
  <path d="M 1001 131 L 1007 138 L 1020 124" stroke="#0d9488" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="264" y="206" font-family="sans-serif" font-size="10.5" fill="#dc2626" text-anchor="middle">wrong action space</text>
  <text x="468" y="206" font-family="sans-serif" font-size="10.5" fill="#dc2626" text-anchor="middle">drifted timestamps</text>
  <text x="672" y="206" font-family="sans-serif" font-size="10.5" fill="#dc2626" text-anchor="middle">success-only corpus</text>
  <text x="876" y="206" font-family="sans-serif" font-size="10.5" fill="#dc2626" text-anchor="middle">conversion project</text>

  <line x1="30" y1="228" x2="1030" y2="228" stroke="#e2e8f0"/>
  <text x="30" y="248" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Each gate removes a distinct failure mode. Failing Gate 1 cannot be fixed downstream.</text>
</svg>
