<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five humanoid data needs stacked from most simulation-friendly to most dependent on real-world capture: balance and proprioception, bimanual coordination, whole-body loco-manipulation, human-scale environments, and working near people">
  <rect x="0" y="0" width="900" height="460" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#14213d">The five data needs of a humanoid</text>

  <!-- axis -->
  <text x="840" y="56" font-family="sans-serif" font-size="10" fill="#2563eb" text-anchor="end">SIMULATION-LED</text>
  <text x="840" y="430" font-family="sans-serif" font-size="10" fill="#dc2626" text-anchor="end">REAL-WORLD-LED</text>
  <line x1="818" y1="62" x2="818" y2="404" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 818 62 L 812 72 L 824 72 Z" fill="#2563eb"/>
  <path d="M 818 404 L 812 394 L 824 394 Z" fill="#dc2626"/>

  <!-- Need 01 -->
  <rect x="30" y="56" width="760" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="80" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563eb">NEED 01</text>
  <text x="50" y="102" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Balance and proprioception</text>
  <text x="780" y="92" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="end">parallel RL in simulation</text>

  <!-- Need 02 -->
  <rect x="30" y="128" width="760" height="64" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <text x="50" y="152" font-family="sans-serif" font-size="10" font-weight="700" fill="#0d9488">NEED 02</text>
  <text x="50" y="174" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Bimanual coordination</text>
  <text x="780" y="164" font-family="sans-serif" font-size="11" fill="#0d9488" text-anchor="end">teleoperation, two hands on one clock</text>

  <!-- Need 03 -->
  <rect x="30" y="200" width="760" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="50" y="224" font-family="sans-serif" font-size="10" font-weight="700" fill="#475569">NEED 03</text>
  <text x="50" y="246" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Whole-body loco-manipulation</text>
  <text x="780" y="236" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">whole-body teleop interface</text>

  <!-- Need 04 -->
  <rect x="30" y="272" width="760" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="50" y="296" font-family="sans-serif" font-size="10" font-weight="700" fill="#d97706">NEED 04</text>
  <text x="50" y="318" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Human-scale environments</text>
  <text x="780" y="308" font-family="sans-serif" font-size="11" fill="#d97706" text-anchor="end">human video, multi-site capture</text>

  <!-- Need 05 -->
  <rect x="30" y="344" width="760" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="50" y="368" font-family="sans-serif" font-size="10" font-weight="700" fill="#dc2626">NEED 05</text>
  <text x="50" y="390" font-family="sans-serif" font-size="16" font-weight="700" fill="#14213d">Working near people</text>
  <text x="780" y="380" font-family="sans-serif" font-size="11" fill="#dc2626" text-anchor="end">real-world capture only</text>

  <line x1="30" y1="424" x2="790" y2="424" stroke="#e2e8f0"/>
  <text x="30" y="446" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Budget shifts from GPU time at the top to site access and operator hours at the bottom.</text>
</svg>
