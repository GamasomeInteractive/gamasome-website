<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Demonstration Design Triangle linking interface, operator, and protocol, with the robot policy in the center">
<rect width="760" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="30" y="38" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#d97706">THE DEMONSTRATION DESIGN TRIANGLE</text>
<polygon points="380,70 600,300 160,300" fill="rgba(217,119,6,0.06)" stroke="#d97706" stroke-width="1.5"/>
<text x="380" y="228" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#14213d">What the policy learns</text>
<g font-family="sans-serif" font-size="13.5" text-anchor="middle">
<rect x="300" y="52" width="160" height="56" rx="8" fill="#ffffff" stroke="#2563eb"/><text x="380" y="76" fill="#14213d">Interface</text><text x="380" y="96" font-size="11.5" fill="#64748b">how actions are captured</text>
<rect x="60" y="280" width="190" height="56" rx="8" fill="#ffffff" stroke="#2563eb"/><text x="155" y="304" fill="#14213d">Operator</text><text x="155" y="324" font-size="11.5" fill="#64748b">skill, consistency, fatigue</text>
<rect x="510" y="280" width="190" height="56" rx="8" fill="#ffffff" stroke="#2563eb"/><text x="605" y="304" fill="#14213d">Protocol</text><text x="605" y="324" font-size="11.5" fill="#64748b">strategy, variety, labels</text>
</g>
</svg>
