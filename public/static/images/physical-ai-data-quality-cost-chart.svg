<svg viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart showing the cost of fixing a data defect rising from capture time through QA, annotation, training, and field deployment">
  <rect x="0" y="0" width="760" height="290" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="38" font-family="sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#d97706">COST TO FIX, BY WHERE YOU CATCH IT (ILLUSTRATIVE)</text>

  <g>
    <rect fill="#0d9488" height="30" rx="4" width="100" x="60" y="210"/>
    <rect fill="#0d9488" opacity="0.85" height="55" rx="4" width="100" x="190" y="185"/>
    <rect fill="#d97706" opacity="0.8" height="90" rx="4" width="100" x="320" y="150"/>
    <rect fill="#d97706" height="135" rx="4" width="100" x="450" y="105"/>
    <rect fill="#dc2626" height="180" rx="4" width="120" x="580" y="60"/>
  </g>

  <g fill="#475569" font-family="sans-serif" font-size="12.5" text-anchor="middle">
    <text x="110" y="262">During capture</text>
    <text x="240" y="262">Session QA</text>
    <text x="370" y="262">Annotation</text>
    <text x="500" y="262">After training</text>
    <text x="640" y="262">In the field</text>
  </g>

  <g fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    <text x="110" y="200">redo a take</text>
    <text x="240" y="175">re-record session</text>
    <text x="370" y="140">relabel batch</text>
    <text x="500" y="95">lost training run</text>
    <text x="640" y="50">customer impact</text>
  </g>
</svg>
