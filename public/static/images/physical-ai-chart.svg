<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart of projected humanoid robot market growth from about 6 billion dollars in 2030 to about 51 billion dollars by 2035, per Yole Group">
  <defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>
  <text x="40" y="32" font-family="sans-serif" font-size="17" font-weight="700" fill="#14213d">Projected humanoid robot market</text>
  <text x="40" y="52" font-family="sans-serif" font-size="12.5" fill="#64748b">Yole Group forecast · USD</text>
  <g stroke="#e6ebf5" stroke-width="1" font-family="sans-serif" font-size="11" fill="#94a3b8">
    <line x1="110" y1="270" x2="720" y2="270"/><text x="100" y="274" text-anchor="end">$0</text>
    <line x1="110" y1="194" x2="720" y2="194"/><text x="100" y="198" text-anchor="end">$20B</text>
    <line x1="110" y1="117" x2="720" y2="117"/><text x="100" y="121" text-anchor="end">$40B</text>
  </g>
  <rect x="200" y="247" width="100" height="23" rx="4" fill="#93c5fd"/>
  <text x="250" y="238" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2563eb">$6B</text>
  <text x="250" y="290" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">2030</text>
  <rect x="440" y="75" width="100" height="195" rx="4" fill="url(#barGrad)"/>
  <text x="490" y="66" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#4f46e5">$51B</text>
  <text x="490" y="290" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">2035</text>
  <path d="M306 240 Q380 150 432 92" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="330" y="150" width="118" height="30" rx="15" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="389" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b45309">≈ 56% CAGR</text>
  <text x="40" y="322" font-family="sans-serif" font-size="11" fill="#94a3b8">Source: Yole Group humanoid robot market forecast, 2026.</text>
</svg>
